/* ---------- IndexedDB store ---------- */
const DBN='unique_restore_points',ST='pts';
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function run(mode,fn){const d=await open();return new Promise((res,rej)=>{const t=d.transaction(ST,mode),r=fn(t.objectStore(ST));t.oncomplete=()=>{d.close();res(r&&r.result)};t.onerror=t.onabort=()=>{d.close();rej(t.error)}})}
async function pack(str){
  if(typeof CompressionStream==='undefined')return{gz:false,data:str};
  const buf=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
  return{gz:true,data:buf};
}
async function unpack(rec){
  if(!rec.gz)return rec.data;
  return new Response(new Blob([rec.data]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}
/* fingerprint of the user's DATA only (the export timestamp and our own bookkeeping would otherwise make every snapshot look new) */
function sig(str){
  let t=str;
  try{const o=JSON.parse(str);delete o.exportedAt;if(o.data&&o.data.settings)delete o.data.settings.backup;t=JSON.stringify(o)}catch(_){}
  let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}
  return (h>>>0).toString(36)+':'+t.length;
}
const counts=()=>{const d=window.db;return{sales:(d.sales||[]).length,purchases:(d.purchases||[]).length,products:(d.models||[]).length,customers:(d.customers||[]).length}};
const KIND={auto:'خودکار',manual:'دستی','pre-restore':'قبل از بازیابی'};

const Backup=U.Backup={
  KIND,
  /* create a restore point; returns meta, or null when nothing changed since the last automatic one */
  async snapshot(kind,label){
    const text=window.exportData();                      /* already strips the AI key */
    const b=cfg(),sg=sig(text);
    if(kind==='auto'&&b.lastSnapSig===sg){b.lastSnap=iso();return null}
    const p=await pack(text);
    const rec={id:'rp'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),at:iso(),kind:kind||'manual',label:label||'',size:text.length,gz:p.gz,data:p.data,zsize:p.gz?p.data.byteLength:text.length,counts:counts(),sig:sg};
    await run('readwrite',s=>s.put(rec));
    b.lastSnap=rec.at;b.lastSnapSig=sg;
    await Backup.prune();
    try{window.saveDB()}catch(_){}
    const{data,...meta}=rec;return meta;
  },
  async list(){const all=await run('readonly',s=>s.getAll());return(all||[]).map(({data,...m})=>m).sort((a,b)=>b.at.localeCompare(a.at))},
  async prune(){
    const keep=cfg().keep,all=await Backup.list();
    if(all.length<=keep)return;
    /* oldest automatic points go first, then the oldest of the others */
    const rank=x=>x.kind==='auto'?0:1;
    const victims=[...all].sort((a,b)=>rank(a)-rank(b)||a.at.localeCompare(b.at));
    for(let n=all.length-keep,i=0;n>0&&i<victims.length;n--,i++)await run('readwrite',s=>s.delete(victims[i].id));
  },
  async remove(id){await run('readwrite',s=>s.delete(id))},
  async restore(id){
    const rec=await run('readonly',s=>s.get(id));if(!rec)throw Error('نقطه‌ی بازیابی پیدا نشد');
    const obj=JSON.parse(await unpack(rec));
    await Backup.snapshot('pre-restore','قبل از بازیابی');   /* so the restore itself can be undone */
    window.replaceDB(obj.data||obj);                          /* validates first and rolls back on failure */
    return rec;
  },
  /* the file backup (the one that protects against losing the device) */
  fileName(){let d;try{d=today()}catch(_){d=new Date().toISOString().slice(0,10)}return 'unique-pro-backup-'+d+'.json'},
  downloadFile(){const txt=window.exportData();window.download(Backup.fileName(),txt);return txt.length},
  async shareFile(){
    const txt=window.exportData(),file=new File([txt],Backup.fileName(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'پشتیبان یونیک'});Backup.markFile('share');return true}
    window.download(Backup.fileName(),txt);return false;
  },
  markFile(kind){const b=cfg();b.last=iso();b.lastKind=kind||'file';b.snoozeUntil=0;try{window.saveDB()}catch(_){}},
  status(){
    const b=cfg(),last=b.last?new Date(b.last).getTime():0,t=Date.now();
    const days=last?Math.floor((t-last)/DAY):null;
    const after=x=>{const v=new Date(x.date||x.createdAt||0).getTime();return v>last};
    const d=window.db,newDocs=last?(d.sales||[]).filter(after).length+(d.purchases||[]).filter(after).length:(d.sales||[]).length+(d.purchases||[]).length;
    const due=+b.reminderDays>0&&hasData()&&(!last||days>=+b.reminderDays)&&t>(+b.snoozeUntil||0);
    return{last:b.last||null,days,newDocs,due,auto:b.auto!==false,intervalHours:+b.intervalHours||24,reminderDays:+b.reminderDays,lastSnap:b.lastSnap||null};
  },
  /* scheduler: one automatic restore point per interval, only when data changed */
  async tick(force){
    if(Backup._busy)return null;
    const b=cfg();if(!force&&b.auto===false)return null;
    if(!hasData())return null;
    const last=b.lastSnap?new Date(b.lastSnap).getTime():0;
    if(!force&&Date.now()-last<(+b.intervalHours||24)*36e5)return null;
    Backup._busy=true;
    try{return await Backup.snapshot('auto')}catch(e){console.warn('restore point failed',e);return null}finally{Backup._busy=false}
  }
};

/* ===== Unique — 85 diagnostics: local error log =====
   49 places in the app swallow errors silently. A shop owner with a problem needs something to send us, so uncaught errors and
   rejected promises are kept (last 50, in this browser only) and can be copied as a plain-text report: version, browser, page, messages.
   The report never contains business data or API keys. */
(function(){'use strict';
const U=window.UAI,UI=U.ui,KEY='uai_errlog',MAX=50;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(_){return[]}};
const write=a=>{try{localStorage.setItem(KEY,JSON.stringify(a.slice(-MAX)))}catch(_){}};
const NOISE=/ResizeObserver loop|Script error\.?$|Non-Error promise rejection captured with value: undefined/i;
function add(msg,src,stack){
  msg=String(msg||'').slice(0,300);if(!msg||NOISE.test(msg))return;
  const a=read(),last=a[a.length-1],now=Date.now();
  const entry={t:new Date().toISOString(),page:window.page||'',v:window.YOUNIQUE_VERSION||'',msg,src:String(src||'').slice(0,120),stack:String(stack||'').split('\n').slice(0,4).join('\n').slice(0,400)};
  if(last&&last.msg===msg&&last.src===entry.src&&now-new Date(last.t).getTime()<1000){last.n=(last.n||1)+1}
  else a.push(entry);
  write(a);
}
window.addEventListener('error',e=>{if(e&&e.target&&e.target!==window&&e.target.tagName)return;add(e.message,(e.filename||'').split('/').pop()+':'+e.lineno+':'+e.colno,e.error&&e.error.stack)});
window.addEventListener('unhandledrejection',e=>{const r=e&&e.reason;add(r&&r.message?r.message:String(r),'promise',r&&r.stack)});
const Diag=U.Diag={
  log:add,
  list:read,
  clear(){write([]);},
  report(){
    const a=read();
    return ['گزارش خطای یونیک','نسخه: '+(window.YOUNIQUE_VERSION||'?'),'مرورگر: '+navigator.userAgent,'زمان گزارش: '+new Date().toISOString(),'تعداد خطا: '+a.length,'']
      .concat(a.map((x,i)=>`#${i+1} ${x.t} · صفحه: ${x.page} · ${x.msg}${x.n>1?' (×'+x.n+')':''}\n   ${x.src}${x.stack?'\n   '+x.stack.replace(/\n/g,'\n   '):''}`)).join('\n');
  }
};
UI.diagModal=function(){
  const a=Diag.list().slice().reverse();
