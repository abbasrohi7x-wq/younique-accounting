  for(const [key,rows] of [['models',data.models],['variants',data.variants],['sales',data.sales],['purchases',data.purchases],['customers',data.customers],['suppliers',data.suppliers]]){

}

function validateLedger(){
 const bad=[],issues=[];let totalDebit=0,totalCredit=0;
 const cents=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
 for(const j of db.journal||[]){
  const ref=String(j.ref||j.id||'سند بدون شناسه');
  if(!Array.isArray(j.lines)||!j.lines.length){bad.push(ref);issues.push({ref,code:'missing_lines',message:'سند ردیف حسابداری ندارد'});continue}
  let debit=0,credit=0,invalid=false;
  for(const l of j.lines){
   const d=Number(l?.debit??0),c=Number(l?.credit??0);
   if(!l||!l.account||!Number.isFinite(d)||!Number.isFinite(c)||d<0||c<0||(d>0&&c>0)){
    invalid=true;issues.push({ref,code:'invalid_line',message:'ردیف نامعتبر یا دارای مبلغ منفی/هم‌زمان بدهکار و بستانکار'});continue;
   }
   debit+=d;credit+=c;
  }
  totalDebit+=debit;totalCredit+=credit;
  if(invalid||Math.abs(cents(debit)-cents(credit))>.01){bad.push(ref);if(!invalid)issues.push({ref,code:'unbalanced_lines',message:`جمع ردیف‌ها نامتوازن است: ${cents(debit)} در برابر ${cents(credit)}`})}
  if(j.debit!==undefined&&Number.isFinite(Number(j.debit))&&Math.abs(cents(debit)-cents(j.debit))>.01){if(!bad.includes(ref))bad.push(ref);issues.push({ref,code:'header_debit_mismatch',message:'جمع بدهکار سربرگ با ردیف‌ها یکسان نیست'})}
  if(j.credit!==undefined&&Number.isFinite(Number(j.credit))&&Math.abs(cents(credit)-cents(j.credit))>.01){if(!bad.includes(ref))bad.push(ref);issues.push({ref,code:'header_credit_mismatch',message:'جمع بستانکار سربرگ با ردیف‌ها یکسان نیست'})}
 }
 const difference=cents(totalDebit-totalCredit);
 if(Math.abs(difference)>.01)issues.push({ref:'دفتر کل',code:'global_imbalance',message:`اختلاف کل دفتر: ${difference}`});
 return {ok:bad.length===0&&Math.abs(difference)<=.01,bad:[...new Set(bad)],issues,totalDebit:cents(totalDebit),totalCredit:cents(totalCredit),difference};
}


function reconcileAccounts(){
 const cents=v=>Math.round((Number(v)+Number.EPSILON)*100)/100;
 const journal=Array.isArray(db.journal)?db.journal:[];
 const balance=(account,predicate=()=>true)=>journal.reduce((sum,j)=>sum+(j.lines||[]).reduce((a,l)=>a+(l.account===account&&predicate(l)?num(l.debit)-num(l.credit):0),0),0);

 const inventoryBook=typeof costValue==='function'?num(costValue()):null;
 const items=[
  {code:'inventory',label:'ارزش موجودی کالا',ledger:cents(inventoryLedger),subledger:inventoryBook===null?null:cents(inventoryBook),difference:inventoryBook===null?null:cents(inventoryLedger-inventoryBook),note:'مقایسه حساب موجودی دفتر کل با ارزش لایه‌های بهای تمام‌شده'},
  {code:'receivable',label:'مطالبات مشتریان',ledger:cents(receivableControl),subledger:cents(customerSubledger),difference:cents(receivableControl-customerSubledger),note:'کنترل حساب دریافتنی در برابر مانده تفصیلی مشتریان'},
  {code:'payable',label:'بدهی تأمین‌کنندگان',ledger:cents(payableControl),subledger:cents(supplierSubledger),difference:cents(payableControl-supplierSubledger),note:'کنترل حساب پرداختنی در برابر مانده تفصیلی تأمین‌کنندگان'}
 ].map(x=>({...x,status:x.difference===null?'unknown':Math.abs(x.difference)<=0.01?'ok':'mismatch'}));
 const unassignedReceivable=cents(balance('receivable',l=>l.partyType!=='customer'||!l.partyId||!(db.customers||[]).some(p=>String(p.id)===String(l.partyId))));

function ocrNumbers(s){const t=normalizeOCRLine(s).replace(/(?<=\d)[oO](?=\d)/g,'0').replace(/(?<=\d)[lI](?=\d)/g,'1');return (t.match(/\d+(?:[.,]\d+)*(?:\.\d+)?/g)||[]).map(x=>Number(x.replace(/,/g,''))).filter(Number.isFinite)}
function stripOCRNumbers(s){return normalizeOCRLine(s).replace(/\d+(?:[.,]\d+)*/g,' ').replace(/[|:؛;]+/g,' ').replace(/\s+/g,' ').trim()}
function parseLocalInvoiceText(text,barcodes=[],ocrConfidence=.55){
 const rawLines=String(text||'').split(/\r?\n/).map(normalizeOCRLine).filter(Boolean),lines=rawLines.filter(l=>l.length>=2);
 const label=(rx)=>{const l=lines.find(x=>rx.test(x));if(!l)return null;const m=l.match(rx);return m?.[1]?.trim()||null};
 const invoiceNumber=label(/(?:شماره(?:\s+فاکتور)?|فاکتور(?:\s+شماره)?|invoice\s*(?:no|number)?)[\s:#-]*([A-Za-z0-9۰-۹٠-٩\/-]{3,})/i);
 const date=label(/(?:تاریخ|date)[\s:#-]*([0-9۰-۹٠-٩]{4}[\/-][0-9۰-۹٠-٩]{1,2}[\/-][0-9۰-۹٠-٩]{1,2})/i);
 const supplierName=label(/(?:فروشنده|تامین.?کننده|تأمین.?کننده|نام فروشگاه|شرکت|seller|supplier)[\s:#-]*(.{2,})/i);
 const totalLine=lines.find(l=>/(?:مبلغ (?:قابل\s+)?(?:پرداخت|برداخت)|قابل\s+(?:پرداخت|برداخت)|خالص\s+پرداخت|amount due)/i.test(l))||lines.find(l=>/(?:جمع کل|grand total|total)/i.test(l));
 const discountLine=lines.find(l=>/(?:تخفیف|discount)/i.test(l));const taxLine=lines.find(l=>/(?:مالیات|tax)/i.test(l));
 let sourceCurrency=/تومان|irt/i.test(text)?'IRT':/ریال|irr/i.test(text)?'IRR':'unknown';
 const scale=sourceCurrency==='IRT'?10:1;
 const total=totalLine?((ocrNumbers(totalLine).at(-1)||0)*scale):0,discount=discountLine?((ocrNumbers(discountLine).at(-1)||0)*scale):0,tax=taxLine?((ocrNumbers(taxLine).at(-1)||0)*scale):0;
 const colors=(db.colors||[]).slice().sort((a,b)=>String(b).length-String(a).length);const sizeRx=/(?:سایز|size)?\s*\b(1[7-9]|[2-4][0-9])\b/i;
 const metaRx=/^(?:شماره|فاکتور|تاریخ|فروشنده|خریدار|آدرس|تلفن|مالیات|تخفیف|جمع(?:\s+کل)?|قابل\s+پرداخت|مبلغ|خالص|total|invoice|date|seller|buyer|subtotal|amount|discount|tax|vat)/i;
 const items=[];
 for(const line of lines){
  if(metaRx.test(line)||/(?:جمع\s*کل|قابل\s*پرداخت|مبلغ\s*قابل|تخفیف|مالیات|subtotal|grand total|amount due|discount|tax)/i.test(line))continue;
  let nums=ocrNumbers(line);if(nums.length<2)continue;
  const barcode=barcodes.find(b=>line.includes(b))||((line.match(/\b\d{8,14}\b/g)||[]).find(b=>!/[.,]/.test(b))||null);
  nums=nums.filter(n=>String(Math.trunc(n)).length<8);
  let size=null;const sm=line.match(sizeRx);if(sm)size=String(sm[1]);else{const z=nums.find(n=>Number.isInteger(n)&&n>=17&&n<=48);if(z&&nums.length>=3){size=String(z);nums.splice(nums.indexOf(z),1)}}
  let qty=1,unit=0,lt=0,best=null;
  for(let qi=0;qi<nums.length;qi++)for(let ui=0;ui<nums.length;ui++)for(let li=0;li<nums.length;li++){
   if(qi===ui||qi===li||ui===li)continue;const q=nums[qi],u=nums[ui],l=nums[li];if(!Number.isInteger(q)||q<1||q>999||u<=0||l<=0)continue;const err=Math.abs(q*u-l)/Math.max(1,l);if(err<=.06&&(!best||err<best.err))best={q,u,l,err};
  }
  if(best){qty=best.q;unit=best.u*scale;lt=best.l*scale}else{const a=nums.at(-2)||0,b=nums.at(-1)||0;if(a>0&&a<=999&&b>=a){qty=a;lt=b*scale;unit=(b/a)*scale}else{qty=1;unit=a*scale;lt=b*scale}}
  if(qty<=0||unit<=0||lt<=0)continue;
  const name=stripOCRNumbers(line).replace(/(?:سایز|size)\s*(?:1[7-9]|[2-4][0-9])/i,' ').replace(/\s+/g,' ').trim();if(name.length<2)continue;
  const color=colors.find(c=>smartNormalize(name).includes(smartNormalize(c)))||null;
  const m=matchInvoiceItem({name,color,size,barcode});let c=Math.min(1,Math.max(.25,ocrConfidence*.72+.18*(m?.matchScore||0)));if(Math.abs(qty*unit-lt)>Math.max(1,lt*.04))c*=.72;
  items.push({line:items.length+1,name,modelCode:null,barcode,sku:null,color,size,qty,unitPrice:Math.round(unit),discount:0,lineTotal:Math.round(lt),confidence:c,notes:c<.72?'نیازمند بررسی کاربر':'استخراج محلی'});
 }
 const subtotal=items.reduce((a,x)=>a+x.lineTotal,0),calculated=subtotal-discount+tax,totalFinal=total||calculated,warnings=[];
 if(sourceCurrency==='unknown')warnings.push('واحد پول فاکتور از تصویر با اطمینان کافی مشخص نشد؛ مبالغ به‌صورت ریال در نظر گرفته شدند.');
 if(!items.length)warnings.push('هیچ ردیف کالایی با اطمینان کافی استخراج نشد.');if(!total)warnings.push('جمع کل فاکتور از تصویر با اطمینان کافی پیدا نشد.');if(total&&Math.abs(total-calculated)>Math.max(1,total*.02))warnings.push(`اختلاف جمع فاکتور با اقلام: ${money(Math.abs(total-calculated))}`);if(barcodes.length)warnings.push('بارکدهای تصویر نیز شناسایی شدند: '+barcodes.join('، '));
 const out={documentType:'purchase_invoice',confidence:Math.min(1,Math.max(0,ocrConfidence*.65+(items.length?Math.min(1,items.length/5)*.2:0)+(total?.15:0))),supplier:{name:supplierName,phone:null,taxId:null},invoiceNumber,date,currency:'IRR',subtotal,discount,tax,shipping:0,total:totalFinal,items,warnings,rawText:text};return normalizeInvoiceResult(out)}
function invoicePrompt(){return `تو موتور استخراج فاکتور فروشگاه یونیک هستی. تصویر فاکتور را با دقت بالا و ردیف به ردیف بررسی کن. هیچ عدد یا قلمی را حدس نزن. اعداد فارسی/عربی را به عدد لاتین تبدیل کن. اگر بخشی ناخواناست مقدار null بده و در warnings بنویس. واحد پول را تشخیص بده و اگر نامشخص است null بگذار. جمع را با حاصل جمع اقلام مقایسه کن و اختلاف را گزارش بده. خروجی فقط JSON معتبر و بدون markdown باشد با این ساختار: {"documentType":"purchase_invoice|sales_invoice|unknown","confidence":0,"supplier":{"name":null,"phone":null,"taxId":null},"invoiceNumber":null,"date":null,"currency":"IRR|IRT|unknown","subtotal":0,"discount":0,"tax":0,"shipping":0,"total":0,"items":[{"line":1,"name":null,"modelCode":null,"barcode":null,"sku":null,"color":null,"size":null,"qty":0,"unitPrice":0,"discount":0,"lineTotal":0,"confidence":0,"notes":null}],"warnings":[],"rawText":null}. همه ردیف‌ها را استخراج کن؛ qty و قیمت را جدا کن؛ اگر قیمت واحد و مبلغ ردیف هر دو دیده می‌شوند هر دو را بررسی کن؛ مجموع را از تصویر بخوان و با محاسبه خودت مقایسه کن؛ برای کالاهای کیف و کفش رنگ و سایز را جدا نگه دار؛ ترتیب ستون‌ها را از خود تصویر تشخیص بده و حدس نزن.`}
async function callVisionJSON(imageData,instruction,verify=false){const a=db.settings.ai||{};if(!a.apiKey)throw Error('API Key هوش مصنوعی وارد نشده است');const endpoint=(a.endpoint||'').trim()||'https://api.openai.com/v1/responses',model=(a.model||'gpt-6-luna').trim();let body;if(/chat\/completions/i.test(endpoint)){const content=[{type:'text',text:instruction},{type:'image_url',image_url:{url:imageData,detail:'high'}}];if(verify)content.push({type:'text',text:'اکنون نتیجه استخراج را ممیزی کن. فقط JSON اصلاح‌شده را برگردان. تک‌تک ردیف‌ها، اعداد، تعداد، قیمت واحد، مبلغ ردیف و جمع کل را دوباره از تصویر کنترل کن. اگر چیزی خوانا نیست حدس نزن.'});body={model,temperature:.1,messages:[{role:'system',content:'تو موتور استخراج دقیق فاکتور فروشگاه هستی. فقط JSON معتبر برگردان.'},{role:'user',content}],max_tokens:7000}}else{const content=[{type:'input_text',text:instruction},{type:'input_image',image_url:imageData,detail:'high'}];if(verify)content.push({type:'input_text',text:'اکنون نتیجه استخراج را ممیزی کن. فقط JSON اصلاح‌شده را برگردان. تک‌تک ردیف‌ها، اعداد، تعداد، قیمت واحد، مبلغ ردیف و جمع کل را دوباره از تصویر کنترل کن. اگر چیزی خوانا نیست حدس نزن.'});body={model,input:[{role:'user',content}],max_output_tokens:7000}}const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.apiKey},body:JSON.stringify(body)});if(!r.ok){let msg='AI '+r.status;try{const er=await r.json();msg=er.error?.message||msg}catch(_){}throw Error(msg)}const j=await r.json(),text=j.output_text||j.choices?.[0]?.message?.content||j.output?.flatMap(x=>x.content||[]).filter(x=>x.type==='output_text').map(x=>x.text).join('\n')||'';const parsed=extractAIJson(text);if(!parsed)throw Error('مدل پاسخ ساختاریافته قابل خواندن برنگرداند');return parsed}

function normalizeInvoiceResult(x){x=x&&typeof x==='object'?x:{};x.items=Array.isArray(x.items)?x.items:[];x.warnings=Array.isArray(x.warnings)?x.warnings:[];const conf=n=>{const z=aiNum(n);return Math.max(0,Math.min(1,z>1?z/100:z))};x.confidence=conf(x.confidence);x.total=aiNum(x.total);x.subtotal=aiNum(x.subtotal);x.discount=aiNum(x.discount);x.tax=aiNum(x.tax);x.shipping=aiNum(x.shipping);x.items=x.items.map((it,i)=>{const m=matchInvoiceItem(it),qty=Math.max(0,aiNum(it.qty)),unit=Math.max(0,aiNum(it.unitPrice)),lt=aiNum(it.lineTotal)||qty*unit;return {...it,line:i+1,qty,unitPrice:unit,lineTotal:lt,confidence:conf(it.confidence),matchedVariantId:m?.id||null,matchScore:m?.matchScore||0,matchedName:m?variantName(m):null}});const calc=x.items.reduce((a,it)=>a+it.lineTotal,0)-x.discount+x.tax+x.shipping;x.calculatedTotal=calc;x.totalDifference=Math.abs((x.total||0)-calc);if(x.totalDifference>Math.max(1,(x.total||calc)*.02))x.warnings.push(`اختلاف جمع فاکتور با جمع اقلام: ${money(x.totalDifference)}`);if(x.items.some(i=>!i.matchedVariantId))x.warnings.push('یک یا چند قلم با کالاهای موجود تطبیق قطعی ندارد.');return x}
function invoicePreviewRows(items){return items.map((i,n)=>`<tr data-inv-row="${n}"><td>${n+1}</td><td><input data-inv-name="${n}" value="${esc(i.name||'')}" style="min-width:150px"></td><td>${i.matchedName?esc(i.matchedName):'<span class="pill amber">تطبیق نشد</span>'}</td><td><input data-inv-qty="${n}" type="number" min="0" step="1" value="${num(i.qty)}" style="width:75px"></td><td><input data-inv-price="${n}" type="number" min="0" value="${num(i.unitPrice)}" style="width:125px"></td><td><input data-inv-total="${n}" type="number" min="0" value="${num(i.lineTotal)}" style="width:135px"></td><td><span data-inv-conf="${n}">${Math.round(num(i.confidence)*100)}%</span></td></tr>`).join('')}

 <div class="modal-actions"><button class="btn" data-close>انصراف</button><button class="btn" id="invoiceRecalc">محاسبه مجدد</button><button class="btn primary" id="invoiceConfirm">تأیید فاکتور و ساخت پیش‌نویس خرید</button></div>`);
 const recalc=()=>{x.items.forEach((i,n)=>{i.name=$(`[data-inv-name="${n}"]`)?.value.trim()||i.name;i.qty=Math.max(0,num($(`[data-inv-qty="${n}"]`)?.value));i.unitPrice=Math.max(0,num($(`[data-inv-price="${n}"]`)?.value));i.lineTotal=Math.max(0,num($(`[data-inv-total="${n}"]`)?.value));});x.subtotal=x.items.reduce((a,i)=>a+num(i.lineTotal),0);x.discount=Math.max(0,num($('#invDiscount')?.value));x.tax=Math.max(0,num($('#invTax')?.value));x.total=Math.max(0,num($('#invTotal')?.value));x.calculatedTotal=x.subtotal-x.discount+x.tax;x.totalDifference=Math.abs(x.total-x.calculatedTotal);$('#invSubtotal').value=x.subtotal;const ok=x.totalDifference<=Math.max(1,x.total*.02)&&x.items.length>0;$('#invCheck').className=ok?'successbox section':'warningbox section';$('#invCheck').innerHTML=ok?`<b>کنترل محاسبات موفق است.</b><p>جمع اقلام − تخفیف + مالیات = ${money(x.calculatedTotal)}</p>`:`<b>نیازمند بررسی.</b><p>محاسبه سیستم: ${money(x.calculatedTotal)} · مبلغ فاکتور: ${money(x.total)} · اختلاف: ${money(x.totalDifference)}</p>`;return ok};
 $('#invoiceRecalc').onclick=recalc;$$('[data-inv-qty],[data-inv-price],[data-inv-total],[data-inv-name]').forEach(e=>e.oninput=recalc);recalc();

async function analyzeInvoiceImage(file){const local=await analyzeInvoiceLocally(file);if(local.text.trim()){const parsed=parseLocalInvoiceText(local.text,local.barcodes,local.confidence);if(parsed){db.aiHistory.push({id:uid(),date:now(),role:'assistant',type:'invoice-local',text:JSON.stringify(parsed)});saveDB(true);showInvoiceResult(parsed,null);return parsed}}const a=db.settings.ai||{};if(a.provider!=='openai'||!a.apiKey){const found=local.barcodes.length?' بارکدهای پیدا شده: '+local.barcodes.join('، '):'';throw Error('OCR محلی متن کافی از تصویر استخراج نکرد. تصویر را صاف، روشن و با وضوح بالاتر بگیرید.'+found)}addBubble('در حال خواندن فاکتور ردیف‌به‌ردیف…','ai');const imageData=await prepareInvoiceImage(file);let result=normalizeInvoiceResult(await callVisionJSON(imageData,invoicePrompt(),false));if(result.confidence<.82||result.warnings.length||result.items.some(i=>i.confidence<.75)||result.totalDifference>Math.max(1,(result.total||1)*.02)){addBubble('برای کاهش خطا، نتیجه یک‌بار دیگر ممیزی می‌شود…','ai');result=normalizeInvoiceResult(await callVisionJSON(imageData,invoicePrompt(),true))}db.aiHistory.push({id:uid(),date:now(),role:'assistant',type:'invoice',text:JSON.stringify(result)});saveDB();showInvoiceResult(result,imageData);return result}
function legacy_showAIAction(action){if(!action||typeof action!=='object'||!action.type)return false;const labels={stock_adjust:'اصلاح موجودی',generate_barcodes:'تولید بارکد',create_purchase:'پیش‌نویس خرید',create_product:'ایجاد کالا'};const title=labels[action.type]||'عملیات پیشنهادی';let detail='';if(action.type==='stock_adjust'){const v=variantBy(action.variantId);if(!v)return false;detail=`${variantName(v)}\nتغییر موجودی: ${num(action.qty)>0?'+':''}${num(action.qty)}`}else if(action.type==='generate_barcodes'){const ids=(action.variantIds||[]).map(x=>variantBy(x)).filter(Boolean);detail=ids.length?ids.map(v=>`${variantName(v)} → ${v.barcode||'بارکد جدید'}`).join('\n'):'تنوع معتبری پیدا نشد.'}else if(action.type==='create_purchase'){const items=Array.isArray(action.items)?action.items:[];detail=items.map(i=>`${variantName(variantBy(i.variantId)||{})} × ${num(i.qty)} · ${money(num(i.unitPrice))}`).join('\n')||'قلم خریدی مشخص نشده است.'}else if(action.type==='create_product'){detail=[action.name,action.brand,action.color,action.size].filter(Boolean).join(' · ')}modal(`<div class="modalhead"><h2>${esc(title)}</h2><button class="close" data-close>×</button></div><div class="successbox"><b>پیشنهاد AI</b><p class="muted" style="white-space:pre-line">${esc(detail)}</p></div><div class="modal-actions"><button class="btn" data-close>انصراف</button><button class="btn primary" id="aiExec">تأیید و اجرا</button></div>`);$('#aiExec').onclick=()=>{try{executeAIAction(action);closeModal()}catch(e){toast(e.message||'اجرای عملیات ناموفق بود',true)}};return true}

async function askAI(q,attachment=null){if(!q&&!attachment)return;addBubble(q||'تحلیل فایل','user');const local=localAI(q||'فایل دریافت شد'),a=db.settings.ai||{};if(a.provider==='openai'&&a.apiKey){try{if(attachment&&attachment.startsWith('data:image/')&&/فاکتور|خرید|فروشنده|اقلام|ردیف/.test(q||''))return await analyzeInvoiceImage(await dataURLToFile(attachment,'invoice.jpg'));const endpoint=(a.endpoint||'').trim()||'https://api.openai.com/v1/responses',model=(a.model||'gpt-6-luna').trim(),content=[{type:'input_text',text:q||'این فایل را تحلیل کن.'}];if(attachment&&attachment.startsWith('data:image/'))content.push({type:'input_image',image_url:attachment,detail:'high'});content.push({type:'input_text',text:'داده فروشگاه برای تحلیل:\n'+JSON.stringify(storeSummary())});const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.apiKey},body:JSON.stringify({model,input:[{role:'user',content}],max_output_tokens:5000})});if(!r.ok)throw Error('AI '+r.status);const j=await r.json(),text=j.output_text||j.output?.flatMap(x=>x.content||[]).filter(x=>x.type==='output_text').map(x=>x.text).join('\n')||local;addBubble(text,'ai');db.aiHistory.push({id:uid(),date:now(),role:'assistant',text});saveDB();const action=extractAIJson(text);if(action)showAIAction(action);return text}catch(e){addBubble(local+'\n\n(تحلیل ابری ناموفق بود: '+e.message+')','ai');return local}}addBubble(local,'ai');return local}

function atomic(label,fn){const before=cloneDB();try{const result=fn();if(!saveDB(true))throw Error('ذخیره اطلاعات ناموفق بود؛ عملیات ثبت نشد. فضای ذخیره‌سازی را بررسی و پشتیبان بگیرید.');return result}catch(e){replaceDBInPlace(normalize(before));const restored=saveDB(true);audit('rollback',label,e?.message||String(e));if(!restored&&document.getElementById('toast'))toast('هشدار جدی: ذخیره‌سازی ناموفق است؛ برنامه را نبندید و فوراً از اطلاعات قابل دسترس پشتیبان بگیرید.',true);throw e}}
function validateData(){const issues=[];const ids=new Set();for(const m of db.models||[]){if(ids.has(m.id))issues.push('شناسه تکراری مدل: '+m.id);ids.add(m.id)}const vids=new Set();const bars=new Map();for(const v of db.variants||[]){if(vids.has(v.id))issues.push('شناسه تکراری تنوع: '+v.id);vids.add(v.id);if(!modelBy(v.modelId))issues.push('تنوع بدون مدل: '+v.id);if(v.barcode){if(bars.has(v.barcode))issues.push('بارکد تکراری: '+v.barcode);bars.set(v.barcode,v.id)}if(num(v.stock)<0)issues.push('موجودی منفی: '+v.id)}for(const j of db.journal||[]){const d=(j.lines||[]).reduce((a,l)=>a+num(l.debit),0),c=(j.lines||[]).reduce((a,l)=>a+num(l.credit),0);if(Math.abs(d-c)>.01)issues.push('سند نامتوازن: '+(j.ref||j.id))}for(const s of db.sales||[])for(const id of s.items||[])if(!db.saleItems.some(i=>i.id===id))issues.push('قلم فروش مفقود: '+id);for(const p of db.purchases||[])for(const id of p.items||[])if(!db.purchaseItems.some(i=>i.id===id))issues.push('قلم خرید مفقود: '+id);return {ok:!issues.length,issues};}
function overdueCustomers(){return db.customers.map(c=>({id:c.id,name:c.name,phone:c.phone||'',balance:customerBalance(c.id)})).filter(x=>x.balance>0).sort((a,b)=>b.balance-a.balance)}
function overdueSuppliers(){return db.suppliers.map(s=>({id:s.id,name:s.name,balance:supplierBalance(s.id)})).filter(x=>x.balance>0).sort((a,b)=>b.balance-a.balance)}
function automationPlan(){const t=totals(),low=suggestedReorder(),health=validateData();return {createdAt:now(),alerts:[...(low.length?[{type:'reorder',count:low.length,text:`${low.length} تنوع نیاز به سفارش دارد.`}]:[]),...(overdueCustomers().length?[{type:'receivable',count:overdueCustomers().length,text:`${overdueCustomers().length} مشتری مانده دریافتنی دارند.`}]:[]),...(overdueSuppliers().length?[{type:'payable',count:overdueSuppliers().length,text:`${overdueSuppliers().length} تأمین‌کننده مانده پرداختنی دارند.`}]:[]),...(!health.ok?[{type:'health',count:health.issues.length,text:'نیاز به بررسی سلامت داده وجود دارد.'}]:[])],totals:t,health,orders:low}}

function returnItemsFor(ref,type){if(type==='sale'){const s=db.sales.find(x=>x.number===ref);return (s?.items||[]).map(id=>{const i=db.saleItems.find(x=>x.id===id);return i?{...i,sourceId:i.id,already:(db.returns||[]).filter(r=>r.type==='sale'&&r.ref===ref).flatMap(r=>r.items||[]).filter(x=>x.saleItemId===i.id).reduce((a,x)=>a+num(x.qty),0)}:null}).filter(Boolean)}const p=db.purchases.find(x=>x.number===ref);return (p?.items||[]).map(id=>{const i=db.purchaseItems.find(x=>x.id===id);return i?{...i,sourceId:i.id,already:(db.returns||[]).filter(r=>r.type==='purchase'&&r.ref===ref).flatMap(r=>r.items||[]).filter(x=>x.purchaseItemId===i.id).reduce((a,x)=>a+num(x.qty),0)}:null}).filter(Boolean)}
function consumePurchaseReturnCost(variantId,qty,ref,fallbackCost=0){ensureCostingState();const v=variantBy(variantId),q=Math.max(0,num(qty));if(!v||!q)return {qty:0,cost:0,unitCost:0,details:[]};if(costingMethod()==='weighted_average')return consumeCost(variantId,q,fallbackCost);
  /* FIFO: prefer the layers that came from the returned purchase, using exact layer value */
  let need=q,total=0,details=[],layers=layerList(variantId);
  for(const l of layers){if(need<=1e-9)break;if(l.source!=='purchase'||String(l.ref)!==String(ref))continue;const rem=Math.max(0,num(l.remaining)),take=Math.min(need,rem);if(take<=0)continue;const lv=layerVal(l),portion=take>=rem-1e-9?lv:roundMoney(lv*take/rem);l.remaining=rem-take;l.value=roundMoney(lv-portion);need-=take;total+=portion;details.push({layerId:l.id,qty:take,unitCost:portion/take,value:portion,source:'purchase',ref})}
  db.costLayers[variantId]=layers.filter(l=>num(l.remaining)>1e-7);
  if(need>1e-9){const c=consumeCost(variantId,need,fallbackCost);total+=c.cost;details.push(...c.details)}
  total=roundMoney(total);return {qty:q,cost:total,unitCost:total/q,details};}
function buildPurchaseReturnJournal(total,costTotal,method,supplierId,ref){const refund=roundMoney(total),bookedCost=roundMoney(costTotal),variance=roundMoney(refund-bookedCost),lines=[];if(method==='credit')lines.push({account:'payable',debit:refund,credit:0,partyType:'supplier',partyId:supplierId});else lines.push({account:paymentAccount(method),debit:refund,credit:0});if(bookedCost>0)lines.push({account:'inventory',debit:0,credit:bookedCost});if(variance>0)lines.push({account:'purchaseReturnVariance',debit:0,credit:variance});else if(variance<0)lines.push({account:'purchaseReturnVariance',debit:-variance,credit:0});const debit=lines.reduce((a,l)=>a+num(l.debit),0),credit=lines.reduce((a,l)=>a+num(l.credit),0);if(Math.abs(debit-credit)>0.001)throw Error('سند برگشت خرید نامتوازن است');return {lines,variance,bookedCost}}
function returnModal(){modal(`<div class="modalhead"><h2>ثبت برگشت متصل به فاکتور</h2><button class="close" data-close>×</button></div><form id="rf"><div class="formgrid"><label class="field">نوع<select id="rt"><option value="sale">برگشت فروش</option><option value="purchase">برگشت خرید</option></select></label><label class="field span3">شماره سند<input id="rr" required placeholder="شماره فاکتور"><small class="muted">اقلام فقط از همان فاکتور و با سقف مقدار قابل برگشت نمایش داده می‌شوند.</small></label><div id="returnItems" class="span4"></div><label class="field">روش تسویه<select id="rm"><option value="credit">ثبت در حساب طرف حساب</option><option value="cash">نقدی</option><option value="card">کارتخوان</option><option value="bank">بانک</option></select></label><label class="field span3">شرح<input id="rn"></label></div><div class="modal-actions"><button type="button" class="btn" id="loadReturn">بارگذاری اقلام</button><button class="btn primary">ثبت برگشت</button></div></form>`);

$('#rf').onsubmit=e=>{e.preventDefault();const type=$('#rt').value,ref=$('#rr').value.trim(),items=returnItemsFor(ref,type);if(!items.length)return toast('فاکتور معتبر نیست',true);const qtys=$$('[data-rqty]').map(x=>num(x.value));const chosen=items.map((i,n)=>({...i,returnQty:qtys[n]})).filter(i=>i.returnQty>0);if(!chosen.length)return toast('حداقل یک قلم برای برگشت انتخاب کنید',true);for(const i of chosen){if(!Number.isFinite(i.returnQty)||!Number.isInteger(i.returnQty))return toast('تعداد برگشت باید عدد صحیح باشد',true);if(i.returnQty>num(i.qty)-num(i.already))return toast('تعداد برگشت بیشتر از مقدار قابل برگشت است',true)}const rawTotal=chosen.reduce((a,i)=>a+i.returnQty*num(i.unitPrice),0);/* v42.1: prorate invoice-level discount so refund never exceeds what was actually charged */const srcDoc=type==='sale'?db.sales.find(x=>x.number===ref):db.purchases.find(x=>x.number===ref);const gross=items.reduce((a,i)=>a+num(i.qty)*num(i.unitPrice),0);const ratio=srcDoc&&gross>0&&num(srcDoc.total)>0&&num(srcDoc.total)<gross?num(srcDoc.total)/gross:1;const total=roundMoney(rawTotal*ratio);if(total<=0)return toast('مبلغ برگشت معتبر نیست',true);try{atomic('برگشت '+ref,()=>{const sale=type==='sale'?db.sales.find(x=>x.number===ref):null,pur=type==='purchase'?db.purchases.find(x=>x.number===ref):null;if(type==='sale'&&!sale)throw Error('فاکتور فروش پیدا نشد');if(type==='purchase'&&!pur)throw Error('فاکتور خرید پیدا نشد');if(type==='sale'&&$('#rm').value==='credit'&&!sale.customerId)throw Error('برای تسویه در حساب، فاکتور باید مشتری داشته باشد');if(type==='purchase'&&$('#rm').value==='credit'&&!pur.supplierId)throw Error('برای ثبت در حساب، فاکتور باید تأمین‌کننده داشته باشد');if(['cash','card','bank'].includes($('#rm').value)&&$('#rm').value==='cash'&&!activeCashSession())throw Error('برای برگشت نقدی ابتدا صندوق را باز کنید');
let costTotal=0;const returnItems=[];if(type==='sale'){for(const i of chosen){const v=variantBy(i.variantId);if(!v)throw Error('تنوع کالا پیدا نشد');const c=num(i.cost)||num(v.buyPrice);stockMoveV21(v.id,i.returnQty,'sale_return',ref,c);costTotal+=i.returnQty*c;returnItems.push({variantId:i.variantId,qty:i.returnQty,saleItemId:i.id,unitPrice:i.unitPrice,cost:c,costTotal:i.returnQty*c});}}else{for(const i of chosen){const v=variantBy(i.variantId);if(!v)throw Error('تنوع کالا پیدا نشد');const ci=consumePurchaseReturnCost(v.id,i.returnQty,ref,i.unitPrice);if(ci.qty<i.returnQty-.0001)throw Error(`موجودی قابل برگشت برای «${variantName(v)}» کافی نیست`);v.stock-=i.returnQty;syncVariantCost(v);db.stockMoves.push({id:uid(),date:now(),variantId:v.id,qty:-i.returnQty,type:'purchase_return',ref,cost:ci.unitCost,totalCost:roundMoney(ci.cost),costMethod:costingMethod(),costDetails:ci.details});costTotal+=ci.cost;returnItems.push({variantId:i.variantId,qty:i.returnQty,purchaseItemId:i.id,unitPrice:i.unitPrice,cost:ci.unitCost,costTotal:ci.cost});}}
const row={id:uid(),date:now(),type,ref,total,note:$('#rn').value.trim(),customerId:sale?.customerId||'',supplierId:pur?.supplierId||'',costTotal:roundMoney(costTotal),items:returnItems};db.returns.push(row);const method=$('#rm').value;
if(type==='sale'){const lines=[{account:'salesReturn',debit:total,credit:0}];if(method==='credit')lines.push({account:'receivable',debit:0,credit:total,partyType:'customer',partyId:sale.customerId});else lines.push({account:paymentAccount(method),debit:0,credit:total});if(costTotal){lines.push({account:'inventory',debit:costTotal,credit:0});lines.push({account:'cogs',debit:0,credit:costTotal})}postJournal(ref+'-R'+row.id.slice(-4),'برگشت از فروش',lines,{returnId:row.id,costTotal:roundMoney(costTotal),costingMethod:costingMethod()});if(method!=='credit'){db.payments.push({id:uid(),date:now(),direction:'out',partyType:sale.customerId?'customer':'other',partyId:sale.customerId||'',amount:total,account:paymentAccount(method),ref:ref+'-R'+row.id.slice(-4),embedded:true,note:'پرداخت برگشت فروش'});if(method==='cash')cashMove(activeCashSession().id,-total,'sale_return',ref,'پرداخت برگشت فروش')}}
else{const built=buildPurchaseReturnJournal(total,costTotal,method,pur.supplierId,ref);postJournal(ref+'-R'+row.id.slice(-4),'برگشت از خرید',built.lines,{returnId:row.id,costTotal:built.bookedCost,costingMethod:costingMethod(),returnVariance:built.variance});if(method!=='credit'){db.payments.push({id:uid(),date:now(),direction:'in',partyType:pur.supplierId?'supplier':'other',partyId:pur.supplierId||'',amount:total,account:paymentAccount(method),ref:ref+'-R'+row.id.slice(-4),embedded:true,note:'دریافت برگشت خرید'});if(method==='cash')cashMove(activeCashSession().id,total,'purchase_return',''+ref,'دریافت برگشت خرید')}}

function normalizeAICommandText(v){return String(v??'').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[ً-ٰٟـ]/g,'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٬,]/g,'').trim()}
function parseListAI(v){return String(v||'').split(/\s*(?:و|،|,|\/|\\)\s*/).map(normalizeAICommandText).filter(Boolean)}
function parseSizeListAI(v){
  const s=normalizeAICommandText(v).replace(/تا/g,'-'); const out=[];
  for(const part of s.split(/\s*(?:و|،|,|\/)\s*/)){const m=part.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];if(b-a>31)throw Error('بازه سایز بیش از حد بزرگ است');for(let n=a;n<=b;n++)out.push(String(n));}else if(/^\d+$/.test(part))out.push(part)}
  return [...new Set(out)];
}
function parseMoneyAI(s){return num(String(s||'').replace(/میلیون/g,'000000').replace(/هزار/g,'000').replace(/\s+/g,''))}

  let s=raw.replace(/^(?:لطفا\s*)?(?:یک|یه|یک عدد)\s*/,'').replace(/\s+(?:ثبت|تعریف|ایجاد|اضافه|بساز|ساخت)(?:\s+کن)?\s*$/,'').trim();
  const cat=s.match(/(کیف|کفش|صندل|اکسسوری|بوت|کتانی|دمپایی)/);if(cat)a.category=cat[1];
  const brand=s.match(/(?:برند|مارک)\s*[:：]?\s*([^،,]+?)(?=\s+(?:مدل|رنگ|سایز|قیمت|خرید|فروش|بارکد)|$)/);if(brand)a.brand=brand[1].trim();
  const model=s.match(/(?:مدل|کد مدل)\s*[:：]?\s*([^،,]+?)(?=\s+(?:رنگ|سایز|قیمت|خرید|فروش|بارکد)|$)/);if(model)a.modelCode=model[1].trim();
  const color=s.match(/(?:رنگ)\s*[:：]?\s*([^،,]+?)(?=\s+(?:سایز|قیمت|خرید|فروش|بارکد|حداقل)|$)/);if(color)a.colors=parseListAI(color[1]);
  const size=s.match(/(?:سایز)\s*[:：]?\s*([\d\s\-تاو،,\/]+?)(?=\s+(?:با\s+)?(?:قیمت|خرید|فروش|بارکد|حداقل)|$)/);if(size)a.sizes=parseSizeListAI(size[1]);
  const buy=s.match(/(?:قیمت\s*خرید|خرید|بهای\s*خرید)\s*[:：]?\s*([\d۰-۹,٬.]+\s*(?:میلیون|هزار)?)/);if(buy)a.buyPrice=parseMoneyAI(buy[1]);
  const sell=s.match(/(?:قیمت\s*فروش|فروش)\s*[:：]?\s*([\d۰-۹,٬.]+\s*(?:میلیون|هزار)?)/);if(sell)a.sellPrice=parseMoneyAI(sell[1]);

  const min=s.match(/(?:حداقل\s*موجودی|حداقل)\s*[:：]?\s*(\d+)/);if(min)a.minStock=num(min[1]);

(function(){

  window.YOUNIQUE_V16=V16;
  const originalValidateData=window.validateData;
  window.validateData=function(){
    const base=typeof originalValidateData==='function'?originalValidateData():{ok:true,issues:[]};
    const issues=[...(base.issues||[])];
    const bars=new Map(), skus=new Map();
    for(const v of db.variants||[]){
      if(v.barcode){if(bars.has(v.barcode))issues.push(`بارکد تکراری: ${v.barcode}`);else bars.set(v.barcode,v.id)}
      if(v.sku){if(skus.has(v.sku))issues.push(`SKU تکراری: ${v.sku}`);else skus.set(v.sku,v.id)}
      if(!modelBy(v.modelId))issues.push(`تنوع بدون مدل: ${v.id}`);
    }
    for(const m of db.models||[]){if(!String(m.name||'').trim())issues.push(`مدل بدون نام: ${m.id}`)}
    for(const j of db.journal||[]){const d=(j.lines||[]).reduce((a,l)=>a+num(l.debit),0),c=(j.lines||[]).reduce((a,l)=>a+num(l.credit),0);if(Math.abs(d-c)>.01)issues.push(`سند نامتوازن: ${j.ref||j.id}`)}
    return {ok:issues.length===0,issues:[...new Set(issues)]};
  };
  window.inventoryLedger=function(variantId){

    return (db.stockMoves||[]).filter(x=>x.variantId===variantId).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).reduce((acc,m)=>{
      const prev=acc.length?acc[acc.length-1].balance:0;

    },[]);

    $('#fixKardex')?.addEventListener('click',()=>{try{atomic('اصلاح موجودی از روی گردش',()=>{v.stock=calc;saveDB(true);audit('اصلاح موجودی از روی گردش',v.id,String(calc))});closeModal();toast('موجودی با موفقیت با گردش کالا تطبیق داده شد');inventory()}catch(e){toast(e.message,true)}});
  };

    if(!a||typeof a!=='object')throw Error('عملیات هوشمند نامعتبر است');

  window.systemHealth=function(){

    return {version:V16.version,ok:h.ok,issues:h.issues.slice(0,100),models:(db.models||[]).length,variants:(db.variants||[]).length,moves:(db.stockMoves||[]).length,journals:(db.journal||[]).length};
  };
})();

(function migrateV18Cash(){if(db.cashMovements.some(m=>m.delta===undefined)){db.cashMovements.forEach(m=>{if(m.delta!==undefined)return;const t=String(m.type||'');m.delta=t==='opening'?0:(t==='purchase'||t==='out'||t==='expense'||t==='withdraw'?-Math.abs(num(m.amount)):Math.abs(num(m.amount)))});saveDB(true)}})();

function postCashOpeningJournal(s,isFirstSession){
 if(!isFirstSession||num(s.openingCash)<=0)return null;

 if((db.journal||[]).some(j=>j.ref===ref))return null;
 // Only the first-ever cash session can establish the opening cash asset; later shifts must not duplicate it.

function postCashVarianceJournal(s,diff){

  ?[{account:'cashShortage',debit:amount,credit:0},{account:'cash',debit:0,credit:amount}]

(function(){'use strict';

-- Run once in Supabase SQL Editor. Keep the anon key public; never embed service_role keys.
create table if not exists public.younique_snapshots (
  user_id uuid primary key references auth.users(id) on delete cascade,
  revision bigint not null default 0 check (revision >= 0),
  payload jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);

alter table public.younique_snapshots enable row level security;
revoke all on public.younique_snapshots from public, anon;
grant select, insert, update, delete on public.younique_snapshots to authenticated;
drop policy if exists younique_snapshots_select_own on public.younique_snapshots;
drop policy if exists younique_snapshots_insert_own on public.younique_snapshots;
drop policy if exists younique_snapshots_update_own on public.younique_snapshots;
drop policy if exists younique_snapshots_delete_own on public.younique_snapshots;
create policy younique_snapshots_select_own on public.younique_snapshots for select to authenticated using (user_id = auth.uid());
create policy younique_snapshots_insert_own on public.younique_snapshots for insert to authenticated with check (user_id = auth.uid());
create policy younique_snapshots_update_own on public.younique_snapshots for update to authenticated using (user_id = auth.uid()) with check (user_id = auth.uid());
create policy younique_snapshots_delete_own on public.younique_snapshots for delete to authenticated using (user_id = auth.uid());

create or replace function public.younique_sync_pull()
returns jsonb language plpgsql security invoker set search_path = public as $$
declare r public.younique_snapshots%rowtype;
begin
  if auth.uid() is null then raise exception 'authentication_required'; end if;
  select * into r from public.younique_snapshots where user_id = auth.uid();
  if not found then return jsonb_build_object('revision', 0, 'payload', null, 'updated_at', null); end if;
  return jsonb_build_object('revision', r.revision, 'payload', r.payload, 'updated_at', r.updated_at);
end;
$$;

create or replace function public.younique_sync_push(p_expected_revision bigint, p_payload jsonb)
returns jsonb language plpgsql security invoker set search_path = public as $$
declare current_revision bigint; next_revision bigint;
begin
  if auth.uid() is null then raise exception 'authentication_required'; end if;
  if p_payload is null or jsonb_typeof(p_payload) <> 'object' then raise exception 'invalid_payload'; end if;
  -- Serialize pushes per user so two devices cannot silently overwrite each other.
  perform pg_advisory_xact_lock(hashtextextended(auth.uid()::text, 0));
  select revision into current_revision from public.younique_snapshots where user_id = auth.uid() for update;
  if not found then current_revision := 0; end if;
  if current_revision <> p_expected_revision then
    return jsonb_build_object('ok', false, 'conflict', true, 'revision', current_revision);
  end if;
  next_revision := current_revision + 1;
  insert into public.younique_snapshots(user_id, revision, payload, updated_at)
    values (auth.uid(), next_revision, p_payload, now())
    on conflict (user_id) do update set revision = excluded.revision, payload = excluded.payload, updated_at = excluded.updated_at;
  return jsonb_build_object('ok', true, 'revision', next_revision, 'updated_at', now());
end;
$$;

revoke all on function public.younique_sync_pull() from public, anon;
revoke all on function public.younique_sync_push(bigint, jsonb) from public, anon;
grant execute on function public.younique_sync_pull() to authenticated;
grant execute on function public.younique_sync_push(bigint, jsonb) to authenticated;
`;

  async function pushCloud(){const remote=await rpc('younique_sync_pull');const rev=Number(remote?.revision)||0,b=baseline(),h=localHash();
    if(rev>0&&!b){throw Error('در ابر داده وجود دارد اما این دستگاه سابقه همگام‌سازی ندارد. ابتدا «دریافت از ابر» را بزنید تا بازنویسی ناخواسته رخ ندهد.')}
    if(b&&rev!==Number(b.revision)){throw Error('تعارض همگام‌سازی: نسخه ابری از زمان آخرین همگام‌سازی تغییر کرده است. ابتدا نسخه ابری را دریافت و تغییرات را بررسی کنید.')}
    if(rev>0&&b&&rev===Number(b.revision)&&h===b.hash){setStatus('داده‌ای برای ارسال تغییر نکرده است.');return}
    if(rev===0&&!confirm('این نخستین ارسال است و یک کپی از داده‌های این دستگاه در فضای ابری حساب شما ذخیره می‌شود. ادامه می‌دهید؟'))return;
    const result=await rpc('younique_sync_push',{p_expected_revision:rev,p_payload:safeCloudBundle()});if(!result?.ok){throw Error('تعارض نسخه: سرور نسخه '+(result?.revision??'?')+' را دارد؛ ابتدا دریافت از ابر را انجام دهید.')};setBaseline(result.revision,h);setStatus('همگام‌سازی انجام شد؛ شماره بازبینی '+result.revision+'.');
  }
  window.proSync=function(){const c=cfg(),ss=session(),safe=safeCloudBundle();const logged=!!ss?.access_token;
    $('#content').innerHTML=pageHead('همگام‌سازی ابری','اتصال اختیاری Supabase با حفظ کارکرد آفلاین؛ رمز عبور ذخیره نمی‌شود',`<button class="btn" id="exportSafeSync">ساخت بسته انتقال</button><button class="btn" id="downloadCloudSql">دریافت SQL راه‌اندازی</button>`)+
      `<div class="grid">${metricCard('فروش',db.sales.length,'فاکتور')}${metricCard('خرید',db.purchases.length,'فاکتور')}${metricCard('اندازه داده',Math.round(JSON.stringify(safe).length/1024)+' KB','تقریبی')}${metricCard('وضعیت ورود',logged?'متصل':'وارد نشده',logged?(ss.user?.email||'حساب ابری'):'نیازمند ورود',logged?'green':'amber')}</div>`+
      `<div class="card section"><div class="section-title"><h3>۱. تنظیم پروژه ابری</h3><span id="cloudStatus" class="pill ${logged?'green':'amber'}">${logged?'نشست ابری موجود است':'همگام‌سازی هنوز تنظیم نشده'}</span></div><p class="muted">در Supabase یک پروژه بسازید، نشانی Project URL و کلید anon/publishable را وارد کنید و فایل SQL راه‌اندازی را در SQL Editor اجرا کنید. کلید service_role را هرگز اینجا وارد نکنید.</p><form id="cloudConfigForm" class="formgrid"><label class="field span2">Project URL<input id="cloudProjectUrl" type="url" placeholder="https://xxxx.supabase.co" value="${esc(c.url||'')}" required></label><label class="field span2">Anon / Publishable key<input id="cloudAnonKey" type="password" autocomplete="off" placeholder="کلید عمومی پروژه" value="${esc(c.anonKey||'')}" required></label><div class="modal-actions span4"><button class="btn primary">ذخیره تنظیمات پروژه</button></div></form></div>`+
      `<div class="card section"><h3>۲. ورود یا ساخت حساب</h3><p class="muted">حساب کاربری در سرویس Supabase مدیریت می‌شود. گذرواژه در یونیک ذخیره نمی‌شود؛ توکن نشست فقط در session storage همین مرورگر نگهداری می‌شود.</p><form id="cloudLoginForm" class="formgrid"><label class="field span2">ایمیل<input id="cloudEmail" type="email" autocomplete="username" required></label><label class="field span2">گذرواژه<input id="cloudPassword" type="password" autocomplete="current-password" required></label><div class="modal-actions span4"><button class="btn primary" type="submit">ورود</button><button class="btn" type="button" id="cloudSignup">ساخت حساب</button>${logged?'<button class="btn danger" type="button" id="cloudLogout">خروج</button>':''}</div></form></div>`+
      `<div class="card section"><h3>۳. همگام‌سازی</h3><p>ابتدا در دستگاه دوم «دریافت از ابر» را اجرا کنید. یونیک از بازنویسی خودکار نسخه‌ای که در دستگاه دیگر تغییر کرده جلوگیری می‌کند. داده‌ها همچنان روی همین دستگاه آفلاین قابل استفاده‌اند.</p><div class="actions"><button class="btn" id="cloudPull" ${logged?'':'disabled'}>دریافت از ابر</button><button class="btn primary" id="cloudPush" ${logged?'':'disabled'}>ارسال به ابر</button></div><p class="muted">کلید API هوش مصنوعی از نسخه ابری و بسته انتقال حذف می‌شود. همگام‌سازی تا زمان ساخت پروژه، اجرای SQL و ورود موفق فعال نخواهد شد.</p></div>`;
    $('#cloudConfigForm').onsubmit=e=>{e.preventDefault();const url=$('#cloudProjectUrl').value.trim().replace(/\/+$/,''),key=$('#cloudAnonKey').value.trim();try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol)||(!u.hostname.endsWith('.supabase.co')&&!['localhost','127.0.0.1'].includes(u.hostname)))throw Error('نشانی باید از پروژه Supabase باشد (یا localhost برای آزمایش).');if(!key)throw Error('کلید anon لازم است.');const old=cfg();if(old.url!==url||old.anonKey!==key){sessionStorage.removeItem(SESSION_KEY);for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith(BASELINE_PREFIX))localStorage.removeItem(k)}}localStorage.setItem(CONFIG_KEY,JSON.stringify({url,anonKey:key}));setStatus('تنظیمات پروژه در همین دستگاه ذخیره شد.');toast('تنظیمات ذخیره شد؛ اکنون وارد شوید.')}catch(err){setStatus(err.message||'تنظیمات نامعتبر است.',true)}};
    $('#cloudLoginForm').onsubmit=async e=>{e.preventDefault();try{await login(false)}catch(err){setStatus(err.message||'ورود ناموفق بود.',true)}};
    $('#cloudSignup').onclick=async()=>{try{await login(true)}catch(err){setStatus(err.message||'ساخت حساب ناموفق بود.',true)}};
    $('#cloudLogout')?.addEventListener('click',()=>{sessionStorage.removeItem(SESSION_KEY);setStatus('از حساب ابری خارج شدید.');render()});
    $('#cloudPull').onclick=async()=>{try{setStatus('در حال دریافت…');await pullCloud()}catch(err){setStatus(err.message||'دریافت ناموفق بود.',true)}};
    $('#cloudPush').onclick=async()=>{try{setStatus('در حال ارسال…');await pushCloud()}catch(err){setStatus(err.message||'ارسال ناموفق بود.',true)}};
    $('#downloadCloudSql').onclick=()=>download('younique_supabase_setup.sql',SQL_SETUP,'text/plain;charset=utf-8');
    $('#exportSafeSync').onclick=()=>{downloadBundle(safeCloudBundle(),'transfer');toast('بسته انتقال بدون کلید API ساخته شد')};
  };
})();
</script>

<script id="younique-v4290-storefront">
(function(){'use strict';
  groups[0][1].push(['storefront','فروشگاه آنلاین','▣']);
  pageNames['storefront']='فروشگاه آنلاین';
  function shopSettings(){db.settings=db.settings||{};db.settings.storefront={phone:'',tagline:'کالای باکیفیت، خرید آسان',showStock:false,...(db.settings.storefront||{})};return db.settings.storefront}
  function productSnapshot(){return activeVariants().filter(v=>v.active!==false).map(v=>({id:String(v.id),name:String(variantName(v)),sku:String(v.sku||''),barcode:String(v.barcode||''),price:roundMoney(v.sellPrice),stock:Math.max(0,num(v.stock)),category:String(v.category||v.categoryName||db.models.find(m=>m.id===v.modelId)?.category||'سایر')})).filter(v=>v.name&&v.price>=0)}
  function buildStorefrontHTML(products,settings){
    const safeProducts=JSON.stringify(products).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
    const shopName=String(db.settings.shopName||'فروشگاه یونیک').replace(/[<>]/g,'');
    const tagline=String(settings.tagline||'خرید آسان').replace(/[<>]/g,'');
    const phone=String(settings.phone||'').replace(/[^0-9+]/g,'');
    const showStock=!!settings.showStock;
    return `<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769aa"><title>${shopName}</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17283a;font:15px Tahoma,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{padding:26px;background:linear-gradient(135deg,#1769aa,#0f548b);color:#fff;border-radius:22px;margin:10px 0 18px}.hero h1{margin:0 0 10px}.hero p{margin:0;opacity:.9}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input,.toolbar select,.buyer input{min-height:44px;padding:10px;border:1px solid #d5dfeb;border-radius:10px;background:#fff;font:inherit}.toolbar input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.product{background:#fff;border:1px solid #dce4ee;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}.product h3{margin:0;font-size:16px;line-height:1.6}.meta{font-size:12px;color:#66768a}.price{font-weight:bold;color:#1769aa;font-size:19px}.buy{display:flex;gap:8px;margin-top:auto}.buy input{width:72px;min-height:40px;border:1px solid #d5dfeb;border-radius:9px;padding:8px}.btn{border:0;border-radius:10px;background:#1769aa;color:#fff;padding:11px 14px;font:inherit;cursor:pointer}.btn.secondary{background:#e8f1f9;color:#164e79}.cart{background:#fff;border:1px solid #dce4ee;border-radius:16px;padding:18px;margin-top:20px}.cartrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf1f5}.buyer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.buyer input{width:100%}.muted{color:#66768a;font-size:12px}.empty{padding:24px;text-align:center;color:#66768a}@media(max-width:560px){.wrap{padding:12px}.hero{padding:20px}.buyer{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product{padding:11px}.product h3{font-size:14px}.price{font-size:16px}.buy{flex-wrap:wrap}.buy input{width:60px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="hero"><h1>${shopName}</h1><p>${tagline}</p></header><div class="toolbar"><input id="search" placeholder="جست‌وجوی کالا…" aria-label="جست‌وجوی کالا"><select id="category" aria-label="دسته‌بندی"><option value="">همه دسته‌ها</option></select></div><section id="products" class="grid"></section><section class="cart"><h2>سبد سفارش</h2><div id="cartRows" class="empty">سبد خالی است.</div><div class="cartrow"><b>جمع کل</b><b id="total">۰ ریال</b></div><div class="buyer"><input id="buyerName" placeholder="نام خریدار" maxlength="100"><input id="buyerPhone" placeholder="شماره تماس" maxlength="30"><input id="buyerAddress" placeholder="نشانی / توضیح تحویل" maxlength="250" style="grid-column:1/-1"></div><button id="checkout" class="btn">ارسال سفارش در واتساپ</button><p class="muted">این کاتالوگ یک خروجی ایستا از موجودی هنگام تولید است؛ برای به‌روزرسانی قیمت و موجودی، دوباره خروجی بگیرید و فایل را جایگزین کنید. پرداخت آنلاین و ثبت خودکار سفارش در حسابداری در این نسخه متصل نیست.</p></section><p class="muted">ساخته‌شده با یونیک</p></main><script>const PRODUCTS=${safeProducts};const SHOP_PHONE=${JSON.stringify(phone)};const SHOW_STOCK=${JSON.stringify(showStock)};const cart=new Map();const fa=n=>Number(n||0).toLocaleString('fa-IR');const fmt=n=>fa(n)+' ریال';const cats=[...new Set(PRODUCTS.map(p=>p.category).filter(Boolean))];for(const c of cats){const o=document.createElement('option');o.value=c;o.textContent=c;document.querySelector('#category').append(o)}function drawProducts(){const q=document.querySelector('#search').value.trim().toLocaleLowerCase('fa');const c=document.querySelector('#category').value;const list=PRODUCTS.filter(p=>(!q||(p.name+' '+p.sku+' '+p.barcode).toLocaleLowerCase('fa').includes(q))&&(!c||p.category===c));const root=document.querySelector('#products');root.innerHTML='';if(!list.length){root.innerHTML='<div class="empty">کالایی پیدا نشد.</div>';return}for(const p of list){const el=document.createElement('article');el.className='product';const title=document.createElement('h3');title.textContent=p.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=p.category+(p.sku?' · '+p.sku:'')+(SHOW_STOCK?' · موجودی '+fa(p.stock):'');const price=document.createElement('div');price.className='price';price.textContent=fmt(p.price);const controls=document.createElement('div');controls.className='buy';const qty=document.createElement('input');qty.type='number';qty.min='1';qty.step='1';qty.value='1';qty.setAttribute('aria-label','تعداد '+p.name);const add=document.createElement('button');add.className='btn';add.textContent='افزودن';add.disabled=SHOW_STOCK&&p.stock<1;add.onclick=()=>{const n=Math.max(1,Math.trunc(Number(qty.value)||1));if(SHOW_STOCK&&n>p.stock){alert('تعداد بیشتر از موجودی نمایش‌داده‌شده است.');return}cart.set(p.id,Math.min(SHOW_STOCK?p.stock:999999,(cart.get(p.id)||0)+n));drawCart()};controls.append(qty,add);el.append(title,meta,price,controls);root.append(el)}}function drawCart(){const root=document.querySelector('#cartRows');root.innerHTML='';let total=0;for(const [id,q] of cart){const p=PRODUCTS.find(x=>x.id===id);if(!p)continue;total+=p.price*q;const row=document.createElement('div');row.className='cartrow';const name=document.createElement('span');name.textContent=p.name+' × '+fa(q);const amt=document.createElement('b');amt.textContent=fmt(p.price*q);const del=document.createElement('button');del.className='btn secondary';del.textContent='حذف';del.onclick=()=>{cart.delete(id);drawCart()};row.append(name,amt,del);root.append(row)}if(!cart.size)root.textContent='سبد خالی است.';document.querySelector('#total').textContent=fmt(total)}document.querySelector('#search').addEventListener('input',drawProducts);document.querySelector('#category').addEventListener('change',drawProducts);document.querySelector('#checkout').onclick=()=>{if(!cart.size){alert('سبد سفارش خالی است.');return}const name=document.querySelector('#buyerName').value.trim();const customerPhone=document.querySelector('#buyerPhone').value.trim();if(!name||!customerPhone){alert('نام و شماره تماس خریدار را وارد کنید.');return}if(!SHOP_PHONE){alert('شماره واتساپ فروشگاه در تنظیمات یونیک وارد نشده است.');return}const lines=[...cart].map(([id,q])=>{const p=PRODUCTS.find(x=>x.id===id);return p.name+' × '+q+' = '+fmt(p.price*q)});const total=[...cart].reduce((sum,[id,q])=>sum+PRODUCTS.find(x=>x.id===id).price*q,0);const msg='سفارش از '+${JSON.stringify(shopName)}+'\\n'+'نام: '+name+'\\n'+'تماس: '+customerPhone+'\\n'+'تحویل: '+document.querySelector('#buyerAddress').value.trim()+'\\n\\n'+lines.join('\\n')+'%0A%0Aجمع: '+fmt(total);window.location.href='https://wa.me/'+SHOP_PHONE.replace(/\D/g,'')+'?text='+encodeURIComponent(msg)};drawProducts();drawCart();</scr`+`ipt></body></html>`;
  }
  window.buildYouniqueStorefront=buildStorefrontHTML;
  window.proStorefront=function(){const cfg=shopSettings(),products=productSnapshot();$('#content').innerHTML=pageHead('فروشگاه آنلاین','ساخت کاتالوگ قابل میزبانی با سبد سفارش و ارسال به واتساپ',`<button class="btn primary" id="exportStorefront">ساخت فایل فروشگاه</button><button class="btn" id="previewStorefront">پیش‌نمایش کاتالوگ</button>`)+`<div class="grid">${metricCard('کالاهای خروجی',products.length,'تنوع فعال')}${metricCard('قابل فروش',products.filter(x=>x.stock>0).length,'موجودی مثبت')}${metricCard('آخرین تولید',cfg.lastGenerated?esc(cfg.lastGenerated):'—','محلی')}${metricCard('نوع فروشگاه','کاتالوگ ایستا','بدون پرداخت آنلاین','amber')}</div><div class="card section"><h3>تنظیمات فروشگاه</h3><form id="storefrontForm" class="formgrid"><label class="field span2">شماره واتساپ فروشگاه<input id="storePhone" inputmode="tel" placeholder="مثلاً 989121234567" value="${esc(cfg.phone)}" maxlength="24"></label><label class="field span2">شعار فروشگاه<input id="storeTagline" maxlength="160" value="${esc(cfg.tagline)}"></label><label class="field span2"><span>نمایش تعداد موجودی در کاتالوگ</span><select id="storeShowStock"><option value="false" ${!cfg.showStock?'selected':''}>خیر</option><option value="true" ${cfg.showStock?'selected':''}>بله</option></select></label><div class="modal-actions span4"><button class="btn primary">ذخیره تنظیمات</button></div></form></div><div class="card section"><h3>نکته انتشار</h3><p>فایل تولیدشده یک کاتالوگ مستقل شامل قیمت‌های زمان تولید است. برای عمومی‌شدن، آن را در یک سرویس میزبانی استاتیک منتشر کنید. تغییرات انبار در یونیک خودکار به سایت منتشرشده منتقل نمی‌شود؛ برای این کار به backend و اتصال ابری عملیاتی نیاز است.</p><p class="muted">فروشگاه زنده، درگاه پرداخت، ثبت خودکار سفارش و همگام‌سازی موجودی هنوز فعال نیستند.</p></div>`;
    $('#storefrontForm').onsubmit=e=>{e.preventDefault();cfg.phone=$('#storePhone').value.trim();cfg.tagline=$('#storeTagline').value.trim();cfg.showStock=$('#storeShowStock').value==='true';saveDB(true);toast('تنظیمات فروشگاه ذخیره شد');window.proStorefront()};
    $('#exportStorefront').onclick=()=>{const current=shopSettings();current.lastGenerated=now();saveDB(true);const html=buildStorefrontHTML(productSnapshot(),current);download('younique-storefront-'+today()+'.html',html,'text/html;charset=utf-8');toast('فایل کاتالوگ ساخته شد؛ برای انتشار باید آن را میزبانی کنید')};
    $('#previewStorefront').onclick=()=>{const current=shopSettings();const html=buildStorefrontHTML(productSnapshot(),current);const w=window.open('','_blank');if(!w){toast('مرورگر بازشدن پنجره را مسدود کرد؛ از ساخت فایل استفاده کنید.',true);return}w.document.open();w.document.write(html);w.document.close()};
  };
})();
</script>
<script id="younique-v4290-local-lock">
(function(){'use strict';
  const UNLOCK_KEY='younique_local_unlock_v1';
  const oldRender=render;
  const pinRecord=()=>Array.isArray(db.users)?(db.users.find(u=>u.id===db.currentUserId)||db.users[0]||null):null;
  const locked=()=>!!db.security?.loginEnabled&&!!String(pinRecord()?.pin||'')&&sessionStorage.getItem(UNLOCK_KEY)!=='1';
  function renderLock(){
    const u=pinRecord(),sec=db.security||(db.security={failed:0,lockedUntil:null});
    const until=Number(sec.lockedUntil)||0,remaining=Math.max(0,Math.ceil((until-Date.now())/1000));
    document.getElementById('app').innerHTML=`<main class="y-lock" dir="rtl" style="min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f6fa"><section class="y-lock-card" style="width:min(420px,100%);padding:28px;background:#fff;border:1px solid #dce4ee;border-radius:20px;box-shadow:0 16px 48px #0b24401a"><div class="y-lock-logo" style="width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:#1769aa;color:#fff;font-size:28px;font-weight:bold;margin-bottom:16px">ی</div><h1>قفل محلی یونیک</h1><p>برای ادامه، PIN مدیر را وارد کنید.</p>${remaining?'<p class="y-lock-error" role="alert">به‌دلیل ورود ناموفق، '+remaining+' ثانیه دیگر تلاش کنید.</p>':''}<form id="yUnlockForm"><label class="field">PIN<input id="yUnlockPin" type="password" inputmode="numeric" autocomplete="current-password" required ${remaining?'disabled':''} autofocus></label><button class="btn primary" type="submit" ${remaining?'disabled':''}>باز کردن برنامه</button><p id="yUnlockError" class="y-lock-error" role="alert" aria-live="polite"></p></form><p class="y-lock-note">این قفل فقط مانع دسترسی اتفاقی در همین مرورگر می‌شود؛ داده‌های محلی رمزگذاری نشده‌اند و این PIN جایگزین احراز هویت امن سمت سرور نیست.</p></section></main>`;
    const form=document.getElementById('yUnlockForm');
    form.onsubmit=e=>{e.preventDefault();const now=Date.now();if((Number(sec.lockedUntil)||0)>now)return;const entered=document.getElementById('yUnlockPin').value,expected=String(u?.pin||'');if(entered===expected){sec.failed=0;sec.lockedUntil=null;saveDB(true);sessionStorage.setItem(UNLOCK_KEY,'1');oldRender();return}sec.failed=(Number(sec.failed)||0)+1;if(sec.failed>=5){sec.failed=0;sec.lockedUntil=now+30000;saveDB(true);renderLock();return}saveDB(true);document.getElementById('yUnlockError').textContent=`PIN صحیح نیست. ${5-sec.failed} تلاش باقی مانده است.`;document.getElementById('yUnlockPin').value='';document.getElementById('yUnlockPin').focus()};
    if(remaining>0)setTimeout(renderLock,1000);else setTimeout(()=>document.getElementById('yUnlockPin')?.focus(),0);
  }
  render=function(){if(locked()){renderLock();return}oldRender();if(page==='storefront'&&typeof window.proStorefront==='function')window.proStorefront()};

<script id="younique-v4290-warehouse-ledger">
(function(){'use strict';
  // Invoices currently use the main warehouse. Keep the warehouse allocation ledger in step with
  // every canonical stock movement; inter-warehouse transfers remain quantity-neutral globally.
  const baseMove=stockMoveV21;
  /* v45: warehouse allocation is now handled inside the canonical stockMoveV21 (the old outer wrapper was bypassed by invoice paths) */
  window.runYouniqueWarehouseIntegrity=function(){
    if(typeof window.proInit==='function')window.proInit();
    const issues=[];
    for(const v of (db.variants||[])){
      const allocated=(db.warehouses||[]).reduce((sum,w)=>sum+num(db.warehouseStocks?.[w.id]?.[v.id]),0);
      if(Math.abs(allocated-num(v.stock))>.01)issues.push({variantId:v.id,name:variantName(v),stock:num(v.stock),allocated:roundMoney(allocated),difference:roundMoney(allocated-num(v.stock))});
    }
    return {ok:issues.length===0,issues};
  };
  // Repair only the default-warehouse remainder when legacy versions left it stale.
  // If non-default warehouses alone exceed global stock, preserve those allocations and report the conflict.
  window.runYouniqueWarehouseMigration=function(){
    if(typeof window.proInit==='function')window.proInit();
    const main=(db.warehouses||[]).find(w=>w.id==='MAIN')||(db.warehouses||[])[0];
    if(!main)return {changed:0,conflicts:[]};
    let changed=0;const conflicts=[];db.warehouseStocks[main.id]=db.warehouseStocks[main.id]||{};
    for(const v of (db.variants||[])){
      const others=(db.warehouses||[]).filter(w=>w.id!==main.id).reduce((sum,w)=>sum+num(db.warehouseStocks?.[w.id]?.[v.id]),0);
      if(others<=num(v.stock)+.01){const next=Math.max(0,roundMoney(num(v.stock)-others));if(Math.abs(num(db.warehouseStocks[main.id][v.id])-next)>.01){db.warehouseStocks[main.id][v.id]=next;changed++}}
      else conflicts.push({variantId:v.id,name:variantName(v),stock:num(v.stock),otherWarehouseStock:roundMoney(others)});
    }
    if(changed)saveDB(true);
    return {changed,conflicts};
  };
  window.YOUNIQUE_VERSION='45.0.0';
  window.runYouniqueWarehouseMigration();
})();
</script>

<script id="younique-v4300-integrity">
(function(){'use strict';
  const previous=window.runYouniqueFullDiagnostics;
  window.runYouniqueFullDiagnostics=function(){
    let base={ok:true,issues:[]};
    try{if(typeof previous==='function')base=previous()||base;else if(typeof window.runYouniqueHealthCheck==='function')base=window.runYouniqueHealthCheck()||base}catch(e){base={ok:false,issues:['خطا در کنترل‌های پایه: '+(e.message||e)]}}
    const issues=Array.isArray(base.issues)?base.issues.slice():[];
    try{
      const wh=window.runYouniqueWarehouseIntegrity?.();
      if(wh&&!wh.ok)for(const x of wh.issues||[])issues.push('مغایرت انبار کالای «'+(x.name||x.variantId)+'»: موجودی کل '+x.stock+'، مجموع انبارها '+x.allocated+'، اختلاف '+x.difference);
      const seen=new Set();
      for(const v of db.variants||[]){if(!v.id)issues.push('تنوع کالا بدون شناسه وجود دارد.');else if(seen.has(v.id))issues.push('شناسه تنوع کالای تکراری: '+v.id);else seen.add(v.id)}
      for(const s of db.sales||[]){if(s.status==='confirmed')for(const it of s.items||[]){if(it.variantId&&!seen.has(it.variantId))issues.push('فاکتور فروش '+(s.number||s.id)+' به تنوع حذف‌شده ارجاع می‌دهد: '+it.variantId)}}
      for(const p of db.purchases||[]){if(p.status==='confirmed')for(const it of p.items||[]){if(it.variantId&&!seen.has(it.variantId))issues.push('فاکتور خرید '+(p.number||p.id)+' به تنوع حذف‌شده ارجاع می‌دهد: '+it.variantId)}}
    }catch(e){issues.push('خطا در کنترل یکپارچگی بین ماژول‌ها: '+(e.message||e))}
    const unique=[...new Set(issues)];return {...base,ok:unique.length===0,issues:unique,version:window.YOUNIQUE_VERSION||'45.0.0'};
  };window.YOUNIQUE_VERSION='45.0.0';
})();
</script>

function linkRevision(kind,before,list){const d=db.revisionDraft;if(d&&d.type===kind&&list.length===before+1){const nw=list.at(-1),old=(kind==='sale'?saleByNo(d.of):db.purchases.find(x=>x.number===d.of));nw.revisionOf=d.of;if(old)old.revisedBy=nw.number;delete db.revisionDraft;saveDB(true)}}
const _ss=window.saveSale;saveSale=window.saveSale=function(){const n=db.sales.length;const r=_ss.apply(this,arguments);linkRevision('sale',n,db.sales);return r};
const _sp=window.savePurchase;savePurchase=window.savePurchase=function(){const n=db.purchases.length;const r=_sp.apply(this,arguments);linkRevision('purchase',n,db.purchases);return r};
const _sd2=saleDetail;saleDetail=function(id){_sd2(id);const s=db.sales.find(x=>x.id===id);const a=document.querySelector('.modal-actions');if(s&&a&&s.status==='confirmed'){a.insertAdjacentHTML('beforeend','<button class="btn" id="revSaleBtn">اصلاح فاکتور</button>');$('#revSaleBtn').onclick=()=>window.reviseSaleUI(s.number)}};
window.YOUNIQUE_VERSION='45.2.0';
})();
</script>
