function postJournal(ref,desc,lines,meta={}){const clean=lines.map(x=>({...x,debit:roundMoney(x.debit),credit:roundMoney(x.credit)})).filter(x=>x.debit||x.credit);const debit=roundMoney(clean.reduce((a,x)=>a+x.debit,0)),credit=roundMoney(clean.reduce((a,x)=>a+x.credit,0));if(Math.abs(debit-credit)>.01)throw Error(`سند حسابداری نامتوازن است: ${debit} ≠ ${credit}`);db.journal.push({id:uid(),date:now(),ref,description:desc,lines:clean,debit,credit,...meta});saveDB();invalidate();return db.journal.at(-1)}
function accountBalance(account,partyType='',partyId=''){let n=0;for(const j of db.journal||[])for(const l of j.lines||[]){if(l.account!==account)continue;if(partyType&&l.partyType!==partyType)continue;if(partyId&&l.partyId!==partyId)continue;n+=num(l.debit)-num(l.credit)}return n}
function customerBalance(id){return Math.max(0,accountBalance('receivable','customer',id))}
function supplierBalance(id){return Math.max(0,-accountBalance('payable','supplier',id))}
function paymentAccount(account){const a=String(account||'cash').trim().toLowerCase();return (a==='card'||/کارت/.test(a))?'card':(a==='bank'||/بانک|حواله|شبا/.test(a))?'bank':'cash'}
function recordPayment(p){const amount=num(p.amount),acct=paymentAccount(p.account);if(amount<=0)throw Error('مبلغ تراکنش معتبر نیست');if(acct==='cash'&&!activeCashSession())throw Error('برای تراکنش نقدی ابتدا صندوق را باز کنید');const row={id:uid(),date:now(),...p,amount};db.payments.push(row);const party=p.partyType==='customer'?'receivable':p.partyType==='supplier'?'payable':null;if(p.direction==='in'){postJournal(p.ref||row.id,'دریافت وجه',[{account:acct,debit:amount,credit:0},{account:party||'income',debit:0,credit:amount,partyType:p.partyType,partyId:p.partyId}])}else{postJournal(p.ref||row.id,'پرداخت وجه',[{account:party||'expense',debit:amount,credit:0,partyType:p.partyType,partyId:p.partyId},{account:acct,debit:0,credit:amount}])}if(acct==='cash')cashMove(activeCashSession().id,p.direction==='in'?amount:-amount,p.direction==='in'?'receipt':'payment',p.ref||row.id,p.note||'');audit(p.direction==='in'?'دریافت وجه':'پرداخت وجه',p.partyId||'',p.note||'');return row}
function addPayment(p){return recordPayment(p)}

function saleNetTotal(cart,discount=0){return roundMoney(Math.max(0,cart.reduce((a,x)=>a+num(x.qty)*num(x.price)-num(x.discount),0)-num(discount)))}
function yqVatCfg(){const t=db.taxProfile||{},r=Number(t.vatRate)||0;return{on:!!t.enabled&&r>0&&r<100,rate:r,mode:t.vatMode==='inclusive'?'inclusive':'exclusive'}}
function yqSaleVat(cart,discount=0){const c=yqVatCfg(),n=saleNetTotal(cart,discount);if(!c.on)return 0;return c.mode==='inclusive'?roundMoney(n*c.rate/(100+c.rate)):roundMoney(n*c.rate/100)}
function saleTotal(cart,discount=0){const n=saleNetTotal(cart,discount),c=yqVatCfg();return c.on&&c.mode==='exclusive'?roundMoney(n+yqSaleVat(cart,discount)):n}

function validateBackupData(data){
  if(!data||typeof data!=='object'||Array.isArray(data))throw Error('ساختار فایل پشتیبان معتبر نیست.');
  if(!Array.isArray(data.models)||!Array.isArray(data.variants))throw Error('فایل پشتیبان باید دست‌کم فهرست کالاها و تنوع‌ها را داشته باشد.');
  const required=['sales','purchases','customers','suppliers'];
  const missing=required.filter(k=>!Array.isArray(data[k]));
  if(missing.length)throw Error('فایل ناقص است؛ بخش‌های ضروری موجود نیست: '+missing.join('، '));
  const arrayKeys=Object.keys(fresh()).filter(k=>Array.isArray(fresh()[k]));
  const malformed=arrayKeys.filter(k=>data[k]!==undefined&&!Array.isArray(data[k]));
  if(malformed.length)throw Error('نوع داده در این بخش‌ها نادرست است: '+malformed.join('، '));
  for(const [key,rows] of [['models',data.models],['variants',data.variants],['sales',data.sales],['purchases',data.purchases],['customers',data.customers],['suppliers',data.suppliers]]){
    if(rows.some(row=>!row||typeof row!=='object'||Array.isArray(row)))throw Error('ساختار رکوردهای بخش «'+key+'» معتبر نیست.');
  }
  return {products:data.models.length,variants:data.variants.length,sales:data.sales.length,purchases:data.purchases.length,customers:data.customers.length,suppliers:data.suppliers.length};
}
function stockAlerts(){return activeVariants().filter(v=>num(v.stock)<=num(v.minStock)).sort((a,b)=>(num(a.stock)-num(a.minStock))-(num(b.stock)-num(b.minStock)))}
function suggestedReorder(){return stockAlerts().map(v=>{const target=Math.max(num(v.minStock)*2,5),qty=Math.max(0,target-num(v.stock));return {variantId:v.id,name:variantName(v),stock:num(v.stock),min:num(v.minStock),suggestedQty:qty,buyPrice:num(v.buyPrice),estimated:qty*num(v.buyPrice)}}).filter(x=>x.suggestedQty>0)}
function localAI(q){const t=totals(),top=Object.entries(db.saleItems.reduce((a,i)=>(a[i.variantId]=(a[i.variantId]||0)+num(i.qty),a),{})).sort((a,b)=>b[1]-a[1]).slice(0,5);q=String(q||'').toLowerCase();if(/کمبود|خرید|سفارش|انبار/.test(q)){const r=suggestedReorder();return r.length?`پیشنهاد خرید خودکار:\n${r.slice(0,10).map(x=>`• ${x.name} — ${x.suggestedQty} واحد، برآورد ${money(x.estimated)}`).join('\n')}`:'مورد مهمی برای سفارش دیده نشد.'}if(/فروش|درآمد/.test(q))return `فروش امروز: ${money(t.revenue)}\nتعداد فاکتور: ${t.invoices}`;if(/سود/.test(q))return `سود ناخالص تقریبی امروز: ${money(t.profit)}`;if(/پرفروش/.test(q))return top.length?`پرفروش‌ترین تنوع‌ها:\n${top.map(x=>`• ${variantName(variantBy(x[0]))}: ${x[1]} واحد`).join('\n')}`:'داده کافی نیست';return `امروز ${money(t.revenue)} فروش و ${money(t.profit)} سود تقریبی ثبت شده؛ ${t.low} هشدار موجودی دارید.`}

function ledgerReport(){const map={};for(const j of db.journal||[])for(const l of j.lines||[]){const k=l.account||'other';if(!map[k])map[k]={account:k,debit:0,credit:0,balance:0};map[k].debit+=num(l.debit);map[k].credit+=num(l.credit);map[k].balance+=num(l.debit)-num(l.credit)}return Object.values(map)}
function validateLedger(){
 const bad=[],issues=[];let totalDebit=0,totalCredit=0;
 const cents=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
 for(const j of db.journal||[]){
  const ref=String(j.ref||j.id||'سند بدون شناسه');
  if(!Array.isArray(j.lines)||!j.lines.length){bad.push(ref);issues.push({ref,code:'missing_lines',message:'سند ردیف حسابداری ندارد'});continue}
  let debit=0,credit=0,invalid=false;
  for(const l of j.lines){
   const d=Number(l?.debit??0),c=Number(l?.credit??0);
   if(!l||!l.account||!Number.isFinite(d)||!Number.isFinite(c)||d<0||c<0||(d>0&&c>0)){
    invalid=true;issues.push({ref,code:'invalid_line',message:'ردیف نامعتبر یا دارای مبلغ منفی/هم‌زمان بدهکار و بستانکار'});continue;
   }
   debit+=d;credit+=c;
  }
  totalDebit+=debit;totalCredit+=credit;
  if(invalid||Math.abs(cents(debit)-cents(credit))>.01){bad.push(ref);if(!invalid)issues.push({ref,code:'unbalanced_lines',message:`جمع ردیف‌ها نامتوازن است: ${cents(debit)} در برابر ${cents(credit)}`})}
  if(j.debit!==undefined&&Number.isFinite(Number(j.debit))&&Math.abs(cents(debit)-cents(j.debit))>.01){if(!bad.includes(ref))bad.push(ref);issues.push({ref,code:'header_debit_mismatch',message:'جمع بدهکار سربرگ با ردیف‌ها یکسان نیست'})}
  if(j.credit!==undefined&&Number.isFinite(Number(j.credit))&&Math.abs(cents(credit)-cents(j.credit))>.01){if(!bad.includes(ref))bad.push(ref);issues.push({ref,code:'header_credit_mismatch',message:'جمع بستانکار سربرگ با ردیف‌ها یکسان نیست'})}
 }
 const difference=cents(totalDebit-totalCredit);
 if(Math.abs(difference)>.01)issues.push({ref:'دفتر کل',code:'global_imbalance',message:`اختلاف کل دفتر: ${difference}`});
 return {ok:bad.length===0&&Math.abs(difference)<=.01,bad:[...new Set(bad)],issues,totalDebit:cents(totalDebit),totalCredit:cents(totalCredit),difference};
}


function reconcileAccounts(){
 const cents=v=>Math.round((Number(v)+Number.EPSILON)*100)/100;
 const journal=Array.isArray(db.journal)?db.journal:[];
 const balance=(account,predicate=()=>true)=>journal.reduce((sum,j)=>sum+(j.lines||[]).reduce((a,l)=>a+(l.account===account&&predicate(l)?num(l.debit)-num(l.credit):0),0),0);
 const receivableControl=balance('receivable'),payableControl=-balance('payable'),inventoryLedger=balance('inventory');
 const customerSubledger=(db.customers||[]).reduce((sum,p)=>sum+balance('receivable',l=>l.partyType==='customer'&&String(l.partyId||'')===String(p.id)),0);
 const supplierSubledger=(db.suppliers||[]).reduce((sum,p)=>sum+balance('payable',l=>l.partyType==='supplier'&&String(l.partyId||'')===String(p.id)),0)*-1;
 const inventoryBook=typeof costValue==='function'?num(costValue()):null;
 const items=[
  {code:'inventory',label:'ارزش موجودی کالا',ledger:cents(inventoryLedger),subledger:inventoryBook===null?null:cents(inventoryBook),difference:inventoryBook===null?null:cents(inventoryLedger-inventoryBook),note:'مقایسه حساب موجودی دفتر کل با ارزش لایه‌های بهای تمام‌شده'},
  {code:'receivable',label:'مطالبات مشتریان',ledger:cents(receivableControl),subledger:cents(customerSubledger),difference:cents(receivableControl-customerSubledger),note:'کنترل حساب دریافتنی در برابر مانده تفصیلی مشتریان'},
  {code:'payable',label:'بدهی تأمین‌کنندگان',ledger:cents(payableControl),subledger:cents(supplierSubledger),difference:cents(payableControl-supplierSubledger),note:'کنترل حساب پرداختنی در برابر مانده تفصیلی تأمین‌کنندگان'}
 ].map(x=>({...x,status:x.difference===null?'unknown':Math.abs(x.difference)<=0.01?'ok':'mismatch'}));
 const unassignedReceivable=cents(balance('receivable',l=>l.partyType!=='customer'||!l.partyId||!(db.customers||[]).some(p=>String(p.id)===String(l.partyId))));
 const unassignedPayable=cents(-balance('payable',l=>l.partyType!=='supplier'||!l.partyId||!(db.suppliers||[]).some(p=>String(p.id)===String(l.partyId))));
 return {ok:items.every(x=>x.status==='ok'),items,unassignedReceivable,unassignedPayable,checkedAt:now()};
}

function replaceDBInPlace(next){const isObj=x=>x&&typeof x==='object';const sync=(t,s)=>{if(Array.isArray(t)&&Array.isArray(s)){for(let i=0;i<s.length;i++){if(i<t.length&&isObj(t[i])&&isObj(s[i])&&Array.isArray(t[i])===Array.isArray(s[i]))sync(t[i],s[i]);else t[i]=s[i]}t.length=s.length;return}for(const k of Object.keys(t))if(!(k in s))delete t[k];for(const k of Object.keys(s)){if(['__proto__','prototype','constructor'].includes(k))continue;const x=t[k],y=s[k];if(isObj(x)&&isObj(y)&&Array.isArray(x)===Array.isArray(y))sync(x,y);else t[k]=y}};sync(db,next);if(typeof invalidate==='function')invalidate();return db}

function consumePurchaseReturnCost(variantId,qty,ref,fallbackCost=0){ensureCostingState();const v=variantBy(variantId),q=Math.max(0,num(qty));if(!v||!q)return {qty:0,cost:0,unitCost:0,details:[]};if(costingMethod()==='weighted_average')return consumeCost(variantId,q,fallbackCost);
  /* FIFO: prefer the layers that came from the returned purchase, using exact layer value */
  let need=q,total=0,details=[],layers=layerList(variantId);
  for(const l of layers){if(need<=1e-9)break;if(l.source!=='purchase'||String(l.ref)!==String(ref))continue;const rem=Math.max(0,num(l.remaining)),take=Math.min(need,rem);if(take<=0)continue;const lv=layerVal(l),portion=take>=rem-1e-9?lv:roundMoney(lv*take/rem);l.remaining=rem-take;l.value=roundMoney(lv-portion);need-=take;total+=portion;details.push({layerId:l.id,qty:take,unitCost:portion/take,value:portion,source:'purchase',ref})}
  db.costLayers[variantId]=layers.filter(l=>num(l.remaining)>1e-7);
  if(need>1e-9){const c=consumeCost(variantId,need,fallbackCost);total+=c.cost;details.push(...c.details)}
  total=roundMoney(total);return {qty:q,cost:total,unitCost:total/q,details};}
function buildPurchaseReturnJournal(total,costTotal,method,supplierId,ref){const refund=roundMoney(total),bookedCost=roundMoney(costTotal),variance=roundMoney(refund-bookedCost),lines=[];if(method==='credit')lines.push({account:'payable',debit:refund,credit:0,partyType:'supplier',partyId:supplierId});else lines.push({account:paymentAccount(method),debit:refund,credit:0});if(bookedCost>0)lines.push({account:'inventory',debit:0,credit:bookedCost});if(variance>0)lines.push({account:'purchaseReturnVariance',debit:0,credit:variance});else if(variance<0)lines.push({account:'purchaseReturnVariance',debit:-variance,credit:0});const debit=lines.reduce((a,l)=>a+num(l.debit),0),credit=lines.reduce((a,l)=>a+num(l.credit),0);if(Math.abs(debit-credit)>0.001)throw Error('سند برگشت خرید نامتوازن است');return {lines,variance,bookedCost}}

function parseListAI(v){return String(v||'').split(/\s*(?:و|،|,|\/|\\)\s*/).map(normalizeAICommandText).filter(Boolean)}
function parseSizeListAI(v){
  const s=normalizeAICommandText(v).replace(/تا/g,'-'); const out=[];
  for(const part of s.split(/\s*(?:و|،|,|\/)\s*/)){const m=part.match(/^(\d+)\s*-\s*(\d+)$/);if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];if(b-a>31)throw Error('بازه سایز بیش از حد بزرگ است');for(let n=a;n<=b;n++)out.push(String(n));}else if(/^\d+$/.test(part))out.push(part)}

}

function resolveSaleUnitPrice(id,customerId){

function normalizeInvoiceResult(x){x=x&&typeof x==='object'?x:{};x.items=Array.isArray(x.items)?x.items:[];x.warnings=Array.isArray(x.warnings)?x.warnings:[];const conf=n=>{const z=aiNum(n);return Math.max(0,Math.min(1,z>1?z/100:z))};x.confidence=conf(x.confidence);x.total=aiNum(x.total);x.subtotal=aiNum(x.subtotal);x.discount=aiNum(x.discount);x.tax=aiNum(x.tax);x.shipping=aiNum(x.shipping);x.items=x.items.map((it,i)=>{const m=matchInvoiceItem(it),qty=Math.max(0,aiNum(it.qty)),unit=Math.max(0,aiNum(it.unitPrice)),lt=aiNum(it.lineTotal)||qty*unit;return {...it,line:i+1,qty,unitPrice:unit,lineTotal:lt,confidence:conf(it.confidence),matchedVariantId:m?.id||null,matchScore:m?.matchScore||0,matchedName:m?variantName(m):null}});const calc=x.items.reduce((a,it)=>a+it.lineTotal,0)-x.discount+x.tax+x.shipping;x.calculatedTotal=calc;x.totalDifference=Math.abs((x.total||0)-calc);if(x.totalDifference>Math.max(1,(x.total||calc)*.02))x.warnings.push(`اختلاف جمع فاکتور با جمع اقلام: ${money(x.totalDifference)}`);if(x.items.some(i=>!i.matchedVariantId))x.warnings.push('یک یا چند قلم با کالاهای موجود تطبیق قطعی ندارد.');return x}

function parseLocalInvoiceText(text,barcodes=[],ocrConfidence=.55,table=null){
 const base=parseLocalInvoiceTextBase(text,barcodes,ocrConfidence);
 if(!table||!Array.isArray(table.rows)||!table.rows.length)return base;
 /* ruled table read cell by cell: items come straight from the columns, header fields from the text outside the table */
 const lines=String(text||'').split(/\r?\n/).map(normalizeOCRLine).filter(Boolean);

  return {line:0,name,modelCode:null,barcode:null,sku:clean(r.sku).replace(/\s/g,'')||null,color,size:sm?sm[1]:null,qty:r.qty,unitPrice:Math.round(r.unitPrice*scale),discount:0,lineTotal:Math.round(r.lineTotal*scale),confidence:c,notes:r.ok?'استخراج محلی از جدول':'نیازمند بررسی کاربر'}});

 if(items.some(x=>x.confidence<.6))warnings.push('برخی ردیف‌ها با ضرب «تعداد × قیمت = مجموع» نمی‌خوانند؛ قبل از ثبت بررسی کنید.');
 if(barcodes&&barcodes.length)warnings.push('بارکدهای تصویر نیز شناسایی شدند: '+barcodes.join('، '));
 const out={documentType:'purchase_invoice',confidence:Math.min(1,Math.max(0,(table.conf||.5)*.5+.25+(total?.15:0)+(table.consistency||0)*.1)),supplier:base.supplier,invoiceNumber:base.invoiceNumber,date,currency:'IRR',subtotal,discount,tax,shipping:0,total:total||(subtotal-discount+tax),items,warnings,rawText:text};
 return normalizeInvoiceResult(out)
}

function parseLocalProductCommand(q){
  const raw=normalizeAICommandText(q); if(!raw)return null;
  if(!/(ثبت|تعریف|ایجاد|اضافه|بساز|ساخت)/.test(raw)||!/(کالا|محصول|کیف|کفش)/.test(raw))return null;

  const buy=s.match(/(?:قیمت\s*خرید|خرید|بهای\s*خرید)\s*[:：]?\s*([\d۰-۹,٬.]+\s*(?:میلیون|هزار)?)/);if(buy)a.buyPrice=parseMoneyAI(buy[1]);

  name=name.replace(/^(یک|یه|عدد|تا|عددِ)\s+/,'').trim(); if(!name)name=cat?.[1]||''; a.name=name;
  if(!a.category&&/کیف/.test(name))a.category='کیف';else if(!a.category&&/کفش/.test(name))a.category='کفش';
  if(!a.colors.length){const common=['مشکی','سفید','قرمز','آبی','سبز','زرد','قهوه‌ای','کرم','بژ','طوسی','سرمه‌ای','زرشکی','طلایی','نقره‌ای','مشکی / سفید'];a.colors=common.filter(c=>new RegExp('(?:'+c.replace(/\s+\/\s+/g,'\s*[/،]\s*')+')').test(s));}
  if(!a.sizes.length){const numsFound=[...s.matchAll(/(?:^|\s)(1[7-9]|[2-4]\d)(?=\s|$|،|,)/g)].map(x=>x[1]);a.sizes=[...new Set(numsFound)];}

}

function parseLocalCommand(q){const p=parseLocalProductCommand(q);if(p)return p;const s=String(q||'').trim();let m=s.match(/(?:افزایش|اضافه|ورود)\s+(\d+)\s+(?:عدد|تا)?\s*(?:از)?\s*(.+)/i);if(m){const n=num(m[1]),v=productSearch(m[2])[0];if(v)return {type:'stock_adjust',variantId:v.id,qty:n,reason:'فرمان صوتی/متنی'}}m=s.match(/(?:بارکد|کد)\s*(?:بساز|تولید کن|ایجاد کن)\s*(?:برای)?\s*(.+)?/i);if(m)return {type:'generate_barcodes',query:(m[1]||'').trim()};if(/خرید|سفارش/.test(s)&&/کمبود|لازم|نیاز/.test(s))return {type:'reorder_draft',items:suggestedReorder()};return null}

function showAIActionPurchaseFallback(a){const items=(a.items||[]).map(i=>({id:i.variantId,qty:num(i.qty),price:num(i.unitPrice)||num(variantBy(i.variantId)?.buyPrice)})).filter(i=>variantBy(i.id)&&i.qty>0);if(!items.length)return false;modal(`<div class=\"modalhead\"><h2>پیش‌نویس خرید</h2><button class=\"close\" data-close>×</button></div><div class=\"card\">${items.map(i=>`<p>${esc(variantName(variantBy(i.id)))} × ${i.qty} · ${money(i.price)}</p>`).join('')}</div><div class=\"modal-actions\"><button class=\"btn primary\" id=\"aiExec\">ساخت پیش‌نویس خرید</button></div>`);$('#aiExec').onclick=()=>{try{ActionEngine.execute({...a,items});closeModal()}catch(e){toast(e.message,true)}};return true}
function executeAIAction(a){if(a?.type===ActionEngine.TYPES.CREATE_PRODUCT){const r=ActionEngine.execute(a);toast(`کالا با موفقیت ذخیره شد؛ ${r.variantCount} تنوع ایجاد شد.`);page='products';render();return r}return ActionEngine.execute(a)}

(function(){

    const bars=new Map(), skus=new Map();
    for(const v of db.variants||[]){
      if(v.barcode){if(bars.has(v.barcode))issues.push(`بارکد تکراری: ${v.barcode}`);else bars.set(v.barcode,v.id)}
      if(v.sku){if(skus.has(v.sku))issues.push(`SKU تکراری: ${v.sku}`);else skus.set(v.sku,v.id)}

    }
    for(const m of db.models||[]){if(!String(m.name||'').trim())issues.push(`مدل بدون نام: ${m.id}`)}
    for(const j of db.journal||[]){const d=(j.lines||[]).reduce((a,l)=>a+num(l.debit),0),c=(j.lines||[]).reduce((a,l)=>a+num(l.credit),0);if(Math.abs(d-c)>.01)issues.push(`سند نامتوازن: ${j.ref||j.id}`)}
    return {ok:issues.length===0,issues:[...new Set(issues)]};
  };
  window.inventoryLedger=function(variantId){

    return (db.stockMoves||[]).filter(x=>x.variantId===variantId).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).reduce((acc,m)=>{
      const prev=acc.length?acc[acc.length-1].balance:0;
      acc.push({...m,balance:prev+num(m.qty),value: (prev+num(m.qty))*num(m.cost||v.buyPrice)});return acc;
    },[]);
  };

<script id="younique-v4290-warehouse-ledger">
(function(){'use strict';
  // Invoices currently use the main warehouse. Keep the warehouse allocation ledger in step with
  // every canonical stock movement; inter-warehouse transfers remain quantity-neutral globally.
  const baseMove=stockMoveV21;
  /* v45: warehouse allocation is now handled inside the canonical stockMoveV21 (the old outer wrapper was bypassed by invoice paths) */
  window.runYouniqueWarehouseIntegrity=function(){
    if(typeof window.proInit==='function')window.proInit();
    const issues=[];
    for(const v of (db.variants||[])){
      const allocated=(db.warehouses||[]).reduce((sum,w)=>sum+num(db.warehouseStocks?.[w.id]?.[v.id]),0);
      if(Math.abs(allocated-num(v.stock))>.01)issues.push({variantId:v.id,name:variantName(v),stock:num(v.stock),allocated:roundMoney(allocated),difference:roundMoney(allocated-num(v.stock))});
    }
    return {ok:issues.length===0,issues};
  };
  // Repair only the default-warehouse remainder when legacy versions left it stale.
  // If non-default warehouses alone exceed global stock, preserve those allocations and report the conflict.
  window.runYouniqueWarehouseMigration=function(){
    if(typeof window.proInit==='function')window.proInit();
    const main=(db.warehouses||[]).find(w=>w.id==='MAIN')||(db.warehouses||[])[0];
    if(!main)return {changed:0,conflicts:[]};
    let changed=0;const conflicts=[];db.warehouseStocks[main.id]=db.warehouseStocks[main.id]||{};
    for(const v of (db.variants||[])){
      const others=(db.warehouses||[]).filter(w=>w.id!==main.id).reduce((sum,w)=>sum+num(db.warehouseStocks?.[w.id]?.[v.id]),0);
      if(others<=num(v.stock)+.01){const next=Math.max(0,roundMoney(num(v.stock)-others));if(Math.abs(num(db.warehouseStocks[main.id][v.id])-next)>.01){db.warehouseStocks[main.id][v.id]=next;changed++}}
      else conflicts.push({variantId:v.id,name:variantName(v),stock:num(v.stock),otherWarehouseStock:roundMoney(others)});
    }
    if(changed)saveDB(true);
    return {changed,conflicts};
  };
  window.YOUNIQUE_VERSION='1.0';
  window.runYouniqueWarehouseMigration();
})();
</script>

<script id="younique-v4300-integrity">
(function(){'use strict';
  const previous=window.runYouniqueFullDiagnostics;
  window.runYouniqueFullDiagnostics=function(){
    let base={ok:true,issues:[]};
    try{if(typeof previous==='function')base=previous()||base;else if(typeof window.runYouniqueHealthCheck==='function')base=window.runYouniqueHealthCheck()||base}catch(e){base={ok:false,issues:['خطا در کنترل‌های پایه: '+(e.message||e)]}}
    const issues=Array.isArray(base.issues)?base.issues.slice():[];
    try{
      const wh=window.runYouniqueWarehouseIntegrity?.();
      if(wh&&!wh.ok)for(const x of wh.issues||[])issues.push('مغایرت انبار کالای «'+(x.name||x.variantId)+'»: موجودی کل '+x.stock+'، مجموع انبارها '+x.allocated+'، اختلاف '+x.difference);
      const seen=new Set();
      for(const v of db.variants||[]){if(!v.id)issues.push('تنوع کالا بدون شناسه وجود دارد.');else if(seen.has(v.id))issues.push('شناسه تنوع کالای تکراری: '+v.id);else seen.add(v.id)}
      for(const s of db.sales||[]){if(s.status==='confirmed')for(const it of s.items||[]){if(it.variantId&&!seen.has(it.variantId))issues.push('فاکتور فروش '+(s.number||s.id)+' به تنوع حذف‌شده ارجاع می‌دهد: '+it.variantId)}}
      for(const p of db.purchases||[]){if(p.status==='confirmed')for(const it of p.items||[]){if(it.variantId&&!seen.has(it.variantId))issues.push('فاکتور خرید '+(p.number||p.id)+' به تنوع حذف‌شده ارجاع می‌دهد: '+it.variantId)}}
    }catch(e){issues.push('خطا در کنترل یکپارچگی بین ماژول‌ها: '+(e.message||e))}

  };window.YOUNIQUE_VERSION='1.0';
})();
</script>

};

/* ===== 3) Receivable / payable aging (FIFO against ledger) ===== */
function ageParty(account,ptype,list){
  const t0=Date.now(),rows=[];
  for(const p of list){
    const ent=[];
    for(const j of db.journal||[])for(const l of j.lines||[]){
      if(l.account!==account||l.partyType!==ptype||l.partyId!==p.id)continue;
      ent.push({t:Date.parse(j.date)||t0,a:account==='receivable'?num(l.debit)-num(l.credit):num(l.credit)-num(l.debit)});
    }
    if(!ent.length)continue;
    ent.sort((x,y)=>x.t-y.t);
    const ch=[];let adv=0;
    for(const e of ent){
      if(e.a>0){let amt=e.a;const u=Math.min(adv,amt);adv-=u;amt-=u;if(amt>0)ch.push({t:e.t,a:amt})}
      else{let pay=-e.a;for(const c of ch){if(pay<=0)break;const u=Math.min(c.a,pay);c.a-=u;pay-=u}adv+=pay}
    }
    const b=[0,0,0,0];
    for(const c of ch){if(c.a<=0.005)continue;const d=Math.floor((t0-c.t)/864e5);b[d<=30?0:d<=60?1:d<=90?2:3]+=c.a}
    const total=b.reduce((x,y)=>x+y,0);
    if(total>0.005||adv>0.005)rows.push({name:p.name,b,total,adv});
  }
  return rows.sort((x,y)=>y.total-x.total);
}

const st={type:'customer',id:'',from:'',to:''};

  for(const j of db.journal||[])for(const l of j.lines||[]){

   +(st.id?`<div class="grid section">${metricCard('مانده ابتدای دوره',money(D.open),D.cust?'بدهکار = مشتری بدهکار است':'مانده بدهی ما')}${metricCard('مانده پایان دوره',money(D.bal),D.cust?'مطالبات از مشتری':'بدهی به تأمین‌کننده',D.bal>0?'amber':'green')}</div><div class="card section tablewrap"><table><thead><tr><th>تاریخ</th><th>شرح</th><th>سند</th><th>بدهکار</th><th>بستانکار</th><th>مانده</th></tr></thead><tbody>${D.rows.map(r=>`<tr><td>${fd(r.d)}</td><td>${esc(r.desc)}</td><td>${esc(r.ref||'')}</td><td>${r.debit?money(r.debit):'—'}</td><td>${r.credit?money(r.credit):'—'}</td><td><b>${money(r.bal)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="empty">گردشی در این بازه وجود ندارد.</td></tr>'}</tbody></table></div>`:'<div class="card section"><div class="empty">یک مشتری یا تأمین‌کننده را انتخاب کنید.</div></div>');

/* period param: internal periodObj, or Persian phrase string, or ISO from/to */
h.period=(params,dflt)=>{
  if(params.periodObj&&params.periodObj.from)return{p:params.periodObj};
  const s=params.period;
  if(s&&typeof s==='object'&&s.from)return{p:s};
  if(params.from&&params.to){const f=new Date(params.from),t=new Date(params.to);if(isNaN(f)||isNaN(t))return{error:'بازه زمانی معتبر نیست'};return{p:{from:U.startOfDay(f),to:U.addDays(U.startOfDay(t),1),label:`${U.fmtJalali(f)} تا ${U.fmtJalali(t)}`,kind:'custom',meta:{}}}}
  if(s&&typeof s==='string'&&s.trim()){const r=D.parsePeriods(T(N(s)));if(r.periods.length)return{p:r.periods[0]};return{error:`بازه زمانی «${s}» قابل تشخیص نیست (مثال: امروز، ماه قبل، مهر ۱۴۰۵)`}}
  return{p:dflt==='month'?D.thisMonth():D.today()};
};
/* person resolution -> {item}|{ask}|{error}. fields: <kind> (name text) / <kind>Id (resolved) */
h.person=(kind,params,opts={})=>{
  const list=kind==='customer'?window.db.customers:window.db.suppliers,label=kind==='customer'?'مشتری':'تأمین‌کننده',idKey=kind+'Id',nameKey=opts.nameKey||kind;
  if(params[idKey]){const x=list.find(c=>c.id===params[idKey]);return x?{item:x}:{error:{code:'NOT_FOUND',message:`${label} انتخاب‌شده دیگر وجود ندارد`}}}
  const q=h.clean(params[nameKey]);
  if(!q)return{error:{code:'MISSING',message:`نام ${label} مشخص نشده است`}};
  const r=D.pick(D.matchPeople(list,T(N(q))));
  if(r.status==='one')return{item:r.item};
  if(r.status==='none')return{error:{code:'NOT_FOUND',message:`${label} «${q}» در اطلاعات برنامه پیدا نشد`}};
  return{ask:{question:`چند ${label} با نام «${q}» پیدا شد؛ کدام را می‌خواهید؟`,field:idKey,options:r.items.map(x=>({label:x.name+(x.phone?` (${x.phone})`:''),value:x.id}))}};
};
/* product resolution: -> {variants:[...]} | {error} */
h.variants=(p)=>{
  const f={query:p.product||p.query||'',color:p.color,size:p.size,barcode:p.barcode};
  const vs=D.findVariants(f);return vs;
};
h.vname=v=>window.variantName(v);
h.list=(rows,fn,max)=>{const shown=rows.slice(0,max||15);return shown.map((r,i)=>`${U.fa(i+1)}. ${fn(r)}`).join('\n')+(rows.length>shown.length?`\n… و ${U.fa(rows.length-shown.length)} مورد دیگر`:'')};
const ok=params=>({status:'ready',params,needsConfirm:false});
const READ=(def)=>Tools.register(Object.assign({mode:'read',risk:'low',confirm:false,errors:['NOT_FOUND','MISSING','INVALID'],prepare:p=>ok(p)},def));
const P=(props,req)=>({type:'object',properties:props,required:req||[]});
const periodProp={type:'string',description:'بازه زمانی به فارسی: امروز، دیروز، این هفته، ماه قبل، مهر ۱۴۰۵، ۷ روز اخیر، امسال'};

/* ---- sales ---- */
READ({name:'get_sales_summary',desc:'جمع فروش (خالص پس از برگشتی)، تعداد فاکتور و سود در یک بازه؛ اختیاری: فقط یک مشتری',perm:'sales.read',
  params:P({period:periodProp,customer:{type:'string',description:'نام مشتری (اختیاری)'}}),
  prepare(p,ctx){const per=h.period(p);if(per.error)return{status:'error',error:{code:'INVALID',message:per.error}};let c=null;
    if(p.customer||p.customerId){const r=h.person('customer',p);if(r.ask)return{status:'ask',ask:r.ask};if(r.error)return{status:'error',error:r.error};c=r.item}
    return{status:'ready',params:{...p,periodObj:per.p,customerId:c&&c.id},needsConfirm:false}},
  run(p,ctx){const s=D.salesSummary(p.periodObj,{customerId:p.customerId});const out={period:p.periodObj.label,from:p.periodObj.from.toISOString(),to:p.periodObj.to.toISOString(),customer:p.customerId?D.customerName(p.customerId):null,count:s.count,gross:s.gross,returns:s.returns,net:s.net,returnCount:s.returnCount,
      recent:s.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(x=>({number:x.number,date:h.fdate(x.date),customer:D.customerName(x.customerId),total:x.total,due:x.due||0}))};
    if(ctx.can('profit.read'))out.profit=s.profit;return out},
  render(d){if(!d.count&&!d.returnCount)return `در ${d.period}${d.customer?' برای «'+d.customer+'»':''} فروشی ثبت نشده است.`;
    let t=`فروش ${d.period}${d.customer?' — '+d.customer:''}: ${h.money(d.net)}\n${U.fa(d.count)} فاکتور`;if(d.returns)t+=`\nبرگشت از فروش: ${h.shortMoney(d.returns)} (${U.fa(d.returnCount)} مورد؛ در جمع بالا کسر شده)`;if(d.profit!==undefined)t+=`\nسود ناخالص: ${h.shortMoney(d.profit)}`;
    if(d.recent.length)t+='\n\nآخرین فاکتورها:\n'+d.recent.map(r=>`• ${r.number} · ${r.date} · ${r.customer} · ${h.shortMoney(r.total)}${r.due?` (مانده ${h.shortMoney(r.due)})`:''}`).join('\n');return t}});

READ({name:'compare_sales',desc:'مقایسه فروش دو بازه؛ با by=product روند هر کالا (رشد/افت) هم برگردانده می‌شود',perm:'sales.read',
  params:P({periodA:periodProp,periodB:{...periodProp,description:'بازه مبنا؛ اگر خالی باشد بازه قبل از periodA'},by:{type:'string',enum:['total','product']},direction:{type:'string',enum:['growth','decline','any']}}),
  prepare(p){let a=h.period({period:p.periodA,periodObj:p.periodAObj},'month');if(a.error)return{status:'error',error:{code:'INVALID',message:a.error}};
    let b;if(p.periodBObj||p.periodB)b=h.period({period:p.periodB,periodObj:p.periodBObj});else{const pr=D.previousPeriod(a.p);b=pr?{p:pr}:{error:'برای این بازه، بازه قبلی قابل محاسبه نیست'}}
    if(b.error)return{status:'error',error:{code:'INVALID',message:b.error}};return{status:'ready',params:{...p,periodAObj:a.p,periodBObj:b.p},needsConfirm:false}},
  run(p,ctx){const A=D.salesSummary(p.periodAObj),B=D.salesSummary(p.periodBObj);const out={a:{label:p.periodAObj.label,net:A.net,count:A.count},b:{label:p.periodBObj.label,net:B.net,count:B.count},delta:A.net-B.net,pct:B.net?((A.net-B.net)/B.net*100):null,by:p.by||'total',direction:p.direction||'any'};
    if(ctx.can('profit.read')){out.a.profit=A.profit;out.b.profit=B.profit}
    if(p.by==='product'){const ma=D.productAgg(p.periodAObj),mb=D.productAgg(p.periodBObj),keys=new Set([...ma.keys(),...mb.keys()]);
      let rows=[...keys].map(k=>{const x=ma.get(k)||{qty:0,revenue:0},y=mb.get(k)||{qty:0,revenue:0};return{name:(ma.get(k)||mb.get(k)).name,qtyA:x.qty,qtyB:y.qty,revA:Math.round(x.revenue),revB:Math.round(y.revenue),delta:Math.round(x.revenue-y.revenue),pct:y.revenue?((x.revenue-y.revenue)/y.revenue*100):null}});
      if(out.direction==='growth')rows=rows.filter(r=>r.delta>0).sort((x,y)=>y.delta-x.delta);else if(out.direction==='decline')rows=rows.filter(r=>r.delta<0).sort((x,y)=>x.delta-y.delta);else rows.sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta));
      out.products=rows.slice(0,15)}return out},
  render(d){const sign=d.delta>0?'افزایش':d.delta<0?'کاهش':'بدون تغییر';let t=`مقایسه فروش:\n• ${d.a.label}: ${h.shortMoney(d.a.net)} (${U.fa(d.a.count)} فاکتور)\n• ${d.b.label}: ${h.shortMoney(d.b.net)} (${U.fa(d.b.count)} فاکتور)\n`;
    t+=d.pct===null?(d.a.net?`${d.b.label} فروشی نداشته؛ درصد تغییر قابل محاسبه نیست.`:'در هر دو بازه فروشی ثبت نشده است.'):`${sign}: ${h.shortMoney(Math.abs(d.delta))} (${U.fa(Math.abs(d.pct).toFixed(1))}٪)`;
    if(d.products){if(!d.products.length)t+=`\n\nکالایی با این روند (${d.direction==='growth'?'رشد':d.direction==='decline'?'افت':'تغییر'}) پیدا نشد.`;else t+=`\n\n${d.direction==='decline'?'کالاهای دارای افت فروش':d.direction==='growth'?'کالاهای دارای رشد فروش':'تغییر فروش کالاها'}:\n`+h.list(d.products,r=>`${r.name}: ${r.delta>=0?'+':'−'}${h.shortMoney(Math.abs(r.delta))}${r.pct===null?' (بدون فروش در بازه مبنا)':' ('+U.fa(Math.abs(r.pct).toFixed(0))+'٪)'} · ${U.fa(r.qtyB)}←${U.fa(r.qtyA)} عدد`,10)}return t}});

READ({name:'list_sales',desc:'فهرست فاکتورهای فروش یک بازه یا یک مشتری',perm:'sales.read',params:P({period:periodProp,customer:{type:'string'},limit:{type:'integer'}}),
  prepare(p){const per=h.period(p);if(per.error)return{status:'error',error:{code:'INVALID',message:per.error}};let c=null;if(p.customer||p.customerId){const r=h.person('customer',p);if(r.ask)return{status:'ask',ask:r.ask};if(r.error)return{status:'error',error:r.error};c=r.item}return{status:'ready',params:{...p,periodObj:per.p,customerId:c&&c.id},needsConfirm:false}},
  run(p){let l=D.sales(p.periodObj);if(p.customerId)l=l.filter(s=>s.customerId===p.customerId);l.sort((a,b)=>b.date.localeCompare(a.date));return{period:p.periodObj.label,total:l.length,rows:l.slice(0,Math.min(40,p.limit||10)).map(s=>({number:s.number,date:h.fdate(s.date),customer:D.customerName(s.customerId),totalAmount:s.total,due:s.due||0}))}},
  render(d){return d.total?`${U.fa(d.total)} فاکتور در ${d.period}:\n`+d.rows.map(r=>`• ${r.number} · ${r.date} · ${r.customer} · ${h.shortMoney(r.totalAmount)}`).join('\n'):`در ${d.period} فاکتوری ثبت نشده است.`}});

READ({name:'get_invoice',desc:'جزئیات یک فاکتور فروش با شماره',perm:'sales.read',params:P({number:{type:'string',description:'شماره فاکتور'}},['number']),
  prepare(p){const s=p.saleId?window.db.sales.find(x=>x.id===p.saleId):D.invoiceByNumber(p.number);if(!s)return{status:'error',error:{code:'NOT_FOUND',message:`فاکتور «${p.number}» پیدا نشد`}};return{status:'ready',params:{...p,saleId:s.id},needsConfirm:false}},
  run(p){const s=window.db.sales.find(x=>x.id===p.saleId);return{number:s.number,date:h.fdate(s.date),status:s.status,customer:D.customerName(s.customerId),total:s.total,paid:s.paid,due:s.due||0,items:D.saleRows(s).map(i=>({name:window.variantName(window.variantBy(i.variantId)),qty:i.qty,unitPrice:i.unitPrice,total:i.total}))}},
  render(d){return `فاکتور ${d.number}${d.status==='voided'?' (باطل‌شده)':''} · ${d.date}\nمشتری: ${d.customer}\n`+d.items.map(i=>`• ${i.name} × ${U.fa(i.qty)} = ${h.shortMoney(i.total)}`).join('\n')+`\nجمع: ${h.shortMoney(d.total)} · پرداخت‌شده: ${h.shortMoney(d.paid)}${d.due?` · مانده: ${h.shortMoney(d.due)}`:''}`}});

READ({name:'get_top_products',desc:'پرفروش‌ترین کالاها در یک بازه',perm:'sales.read',params:P({period:periodProp,limit:{type:'integer'}}),
  prepare(p){const per=h.period(p,'month');if(per.error)return{status:'error',error:{code:'INVALID',message:per.error}};return{status:'ready',params:{...p,periodObj:per.p},needsConfirm:false}},
  run(p){const rows=[...D.productAgg(p.periodObj).values()].sort((a,b)=>b.qty-a.qty||b.revenue-a.revenue);return{period:p.periodObj.label,rows:rows.slice(0,Math.min(20,p.limit||5)).map(r=>({name:r.name,qty:r.qty,revenue:Math.round(r.revenue)}))}},
  render(d){return d.rows.length?`پرفروش‌ترین کالاها (${d.period}):\n`+h.list(d.rows,r=>`${r.name}: ${U.fa(r.qty)} عدد · ${h.shortMoney(r.revenue)}`):`در ${d.period} فروشی ثبت نشده است.`}});

READ({name:'get_customer_balance',desc:'مانده حساب (بدهی) یک مشتری',perm:'people.read',params:P({customer:{type:'string'}},['customer']),
  prepare(p){const r=h.person('customer',p);if(r.ask)return{status:'ask',ask:r.ask};if(r.error)return{status:'error',error:r.error};return{status:'ready',params:{...p,customerId:r.item.id},needsConfirm:false}},
  run(p){const c=window.db.customers.find(x=>x.id===p.customerId),sales=window.db.sales.filter(s=>s.customerId===c.id&&s.status==='confirmed');return{customerId:c.id,name:c.name,balance:window.customerBalance(c.id),invoices:sales.length,lastSale:sales.length?h.fdate(sales.map(s=>s.date).sort().at(-1)):null}},

READ({name:'get_supplier_balance',desc:'مانده بدهی ما به یک تأمین‌کننده',perm:'people.read',params:P({supplier:{type:'string'}},['supplier']),
  prepare(p){const r=h.person('supplier',p);if(r.ask)return{status:'ask',ask:r.ask};if(r.error)return{status:'error',error:r.error};return{status:'ready',params:{...p,supplierId:r.item.id},needsConfirm:false}},

const debtList=(kind)=>({
  prepare(p){const out={...p};if(p.minAmount!==undefined&&p.minAmount!==null)out.minRial=h.toRial(p.minAmount,p.unit);if(p.maxAmount!==undefined&&p.maxAmount!==null)out.maxRial=h.toRial(p.maxAmount,p.unit);return{status:'ready',params:out,needsConfirm:false}},
  run(p){const list=kind==='customer'?window.db.customers:window.db.suppliers,fn=kind==='customer'?window.customerBalance:window.supplierBalance;
    let rows=list.map(x=>({id:x.id,name:x.name,balance:fn(x.id)})).filter(x=>x.balance>0);if(p.minRial!==undefined)rows=rows.filter(x=>x.balance>p.minRial);if(p.maxRial!==undefined)rows=rows.filter(x=>x.balance<p.maxRial);
    rows.sort((a,b)=>p.sort==='asc'?a.balance-b.balance:b.balance-a.balance);return{kind,count:rows.length,total:rows.reduce((a,x)=>a+x.balance,0),minRial:p.minRial,rows:rows.slice(0,Math.min(50,p.limit||15))}},
  render(d){const who=d.kind==='customer'?'مشتری بدهکار':'تأمین‌کننده طلبکار';if(!d.count)return `${d.minRial?'مورد '+who+' با این شرط':'هیچ '+who+'ی'} پیدا نشد.`;return `${U.fa(d.count)} ${who}${d.minRial?' با مانده بیشتر از '+h.shortMoney(d.minRial):''} · جمع: ${h.money(d.total)}\n`+h.list(d.rows,r=>`${r.name}: ${h.shortMoney(r.balance)}`,d.rows.length)}
});

READ(Object.assign({name:'list_debtors',desc:'فهرست مشتریان بدهکار (با فیلتر حداقل بدهی و مرتب‌سازی)',perm:'people.read',params:P(dp)},debtList('customer')));

const invRows=vs=>vs.map(v=>({variantId:v.id,name:window.variantName(v),stock:num(v.stock),min:num(v.minStock),sellPrice:num(v.sellPrice),buyPrice:num(v.buyPrice)}));
READ({name:'get_inventory',desc:'موجودی کالا بر اساس نام/برند/رنگ/سایز/بارکد',perm:'inventory.read',params:P({product:{type:'string'},color:{type:'string'},size:{type:'string'},barcode:{type:'string'}}),
  prepare(p){if(!h.clean(p.product)&&!p.color&&!p.size&&!p.barcode)return{status:'error',error:{code:'MISSING',message:'نام کالا یا مشخصات آن را بفرمایید'}};return ok(p)},
  run(p,ctx){const vs=h.variants(p);const rows=invRows(vs).map(r=>{if(!ctx.can('profit.read'))delete r.buyPrice;return r});return{query:[p.product,p.color,p.size&&('سایز '+p.size)].filter(Boolean).join(' '),count:rows.length,totalStock:rows.reduce((a,r)=>a+r.stock,0),rows:rows.slice(0,30)}},
  render(d){if(!d.count)return `کالایی با مشخصات «${d.query}» پیدا نشد.`;return `موجودی «${d.query}»: مجموع ${U.fa(d.totalStock)} عدد در ${U.fa(d.count)} تنوع\n`+h.list(d.rows,r=>`${r.name}: ${U.fa(r.stock)} عدد${r.stock<=r.min?' ⚠ کم‌موجود':''} · قیمت فروش ${h.shortMoney(r.sellPrice)}`,30)}});
READ({name:'get_low_stock',desc:'کالاهای کم‌موجود (زیر حداقل تعریف‌شده یا کمتر از یک آستانه)',perm:'inventory.read',params:P({threshold:{type:'integer',description:'موجودی کمتر از این عدد'},color:{type:'string'},limit:{type:'integer'}}),
  prepare:p=>ok(p),
  run(p){let vs=p.threshold!==undefined&&p.threshold!==null?window.activeVariants().filter(v=>num(v.stock)<num(p.threshold)):window.stockAlerts();vs=vs.slice().sort((a,b)=>num(a.stock)-num(b.stock));const rows=invRows(vs);return{threshold:p.threshold,count:rows.length,rows:rows.slice(0,Math.min(60,p.limit||40)),allRows:rows}},
  render(d){return d.count?`${U.fa(d.count)} کالا ${d.threshold!==undefined&&d.threshold!==null?'با موجودی کمتر از '+U.fa(d.threshold)+' عدد':'کم‌موجود'}:\n`+h.list(d.rows,r=>`${r.name}: ${U.fa(r.stock)} عدد (حداقل ${U.fa(r.min)})`,d.rows.length):'کالای کم‌موجودی پیدا نشد.'}});
READ({name:'suggest_reorder',desc:'لیست سفارش پیشنهادی خرید برای کالاهای کم‌موجود (می‌تواند خروجی get_low_stock را به‌عنوان items بگیرد)',perm:'purchase.read',params:P({items:{type:'array',items:{type:'object'},description:'اختیاری: ردیف‌های موجودی که باید سفارش داده شوند'}}),
  prepare:p=>ok(p),
  run(p){let base=Array.isArray(p.items)&&p.items.length?p.items.map(r=>({variantId:r.variantId,name:r.name,stock:r.stock,min:r.min,buyPrice:window.variantBy(r.variantId)?num(window.variantBy(r.variantId).buyPrice):0})).map(x=>{const target=Math.max(x.min*2,5),qty=Math.max(0,target-x.stock);return{...x,suggestedQty:qty,estimated:qty*x.buyPrice}}).filter(x=>x.suggestedQty>0):window.suggestedReorder();
    return{count:base.length,total:base.reduce((a,x)=>a+x.estimated,0),rows:base.slice(0,60)}},
  render(d){return d.count?`لیست سفارش پیشنهادی (${U.fa(d.count)} قلم، برآورد ${h.money(d.total)}):\n`+h.list(d.rows,r=>`${r.name}: ${U.fa(r.suggestedQty)} عدد (موجودی ${U.fa(r.stock)}) ≈ ${h.shortMoney(r.estimated)}`,d.rows.length)+'\n\nاین فقط پیشنهاد است؛ سند خرید ثبت نشده.':'مورد مهمی برای سفارش دیده نشد.'}});

WRITE({name:'create_sale',desc:'ثبت فاکتور فروش با اقلام و نحوه پرداخت (از همان مسیر POS برنامه)',perm:'sales.create',risk:'medium',
  params:P({customer:{type:'string',description:'نام مشتری؛ برای نسیه الزامی'},items:{type:'array',items:P({product:{type:'string'},color:{type:'string'},size:{type:'string'},qty:{type:'integer'},price:{type:'number',description:'قیمت واحد؛ اگر نیامد قیمت ثبت‌شدهٔ کالا'},discount:{type:'number'}},['product','qty'])},
    method:{type:'string',enum:['cash','card','bank','credit'],description:'نحوه پرداخت کامل'},payments:P({cash:{type:'number'},card:{type:'number'},bank:{type:'number'},credit:{type:'number'}}),discount:{type:'number',description:'تخفیف کل فاکتور'},...unitProps},['items']),
  prepare(p){

    const lines=[];

      if(!v){const vs=h.variants(it);if(!vs.length)return err('NOT_FOUND',`کالای «${[it.product,it.color,it.size&&'سایز '+it.size].filter(Boolean).join(' ')}» پیدا نشد`);
        if(vs.length>1)return{status:'ask',ask:{question:`برای «${it.product||'کالا'}» چند مورد پیدا شد؛ کدام؟`,field:`items.${i}.variantId`,options:vs.slice(0,6).map(x=>({label:`${window.variantName(x)} · موجودی ${U.fa(x.stock)}`,value:x.id}))}};v=vs[0];it.variantId=v.id}

      if(qty===null||!Number.isFinite(qty))return{status:'ask',ask:{question:`از «${window.variantName(v)}» چند عدد؟`,field:`items.${i}.qty`,type:'number'}};
      if(!Number.isInteger(qty)||qty<=0)return err('INVALID','تعداد باید عدد صحیح و مثبت باشد');

      if(!(price>=0))return err('INVALID','قیمت معتبر نیست');
      lines.push({variantId:v.id,qty,price,discount:it.discount?h.toRial(it.discount,q.unit):0,name:window.variantName(v)});}
    const merged=[];for(const l of lines){const e=merged.find(x=>x.variantId===l.variantId&&x.price===l.price&&x.discount===l.discount);if(e)e.qty+=l.qty;else merged.push({...l})}
    for(const l of merged){const v=window.variantBy(l.variantId);if(l.qty>num(v.stock))return err('FAILED',`موجودی «${l.name}» کافی نیست (موجود: ${U.fa(num(v.stock))}، درخواستی: ${U.fa(l.qty)})`)}
    const discount=q.discount?h.toRial(q.discount,q.unit):0,cart=merged.map(l=>({id:l.variantId,qty:l.qty,price:l.price,discount:l.discount})),verr=window.saleValidationError(cart,discount);if(verr)return err('INVALID',verr);
    const total=window.saleTotal(cart,discount);if(!(total>0))return err('INVALID','مبلغ فاکتور معتبر نیست');
    let pay={cash:0,card:0,bank:0,credit:0};
    if(q.payments&&typeof q.payments==='object'){for(const k of Object.keys(pay))pay[k]=h.toRial(q.payments[k]||0,q.unit);const sum=pay.cash+pay.card+pay.bank+pay.credit;if(sum>total+0.5)return err('INVALID','مجموع مبالغ پرداخت از مبلغ فاکتور بیشتر است');if(sum<total-0.5)pay.credit+=total-sum}
    else if(q.method&&METHODS[q.method])pay[q.method]=total;
    else return{status:'ask',ask:{question:`جمع فاکتور ${h.money(total)} است. نحوه پرداخت؟`,field:'method',options:Object.entries(METHODS).map(([k,l])=>({label:l,value:k}))}};
    if(pay.credit>0&&!cust)return{status:'ask',ask:{question:'برای فروش نسیه/مانده، نام مشتری لازم است. نام مشتری؟',field:'customer',type:'text'}};
    if(pay.cash>0&&typeof window.activeCashSession==='function'&&!window.activeCashSession())return err('FAILED','برای دریافت نقدی ابتدا باید صندوق باز باشد. صندوق را باز کنید یا روش دیگری انتخاب کنید.');
    const payTxt=Object.entries(pay).filter(([,v])=>v>0).map(([k,v])=>`${METHODS[k]} ${h.shortMoney(v)}`).join(' + ');
    const summary=`فاکتور فروش${cust?' برای «'+cust.name+'»':' (مشتری متفرقه)'}:\n`+merged.map(l=>`• ${l.name} × ${U.fa(l.qty)} @ ${h.shortMoney(l.price)}${l.discount?' (تخفیف '+h.shortMoney(l.discount)+')':''}`).join('\n')+(discount?`\nتخفیف فاکتور: ${h.shortMoney(discount)}`:'')+`\nجمع: ${h.money(total)}\nپرداخت: ${payTxt}`;
    return{status:'ready',params:{customerId:q.customerId||'',cart,discount,pay,total},needsConfirm:true,summary,risk:total>=HIGH_AMOUNT_RIAL?'high':'medium'}},
  async run(p){

    const s=window.db.sales.at(-1);if(s.status!=='confirmed'||Math.abs(num(s.total)-p.total)>1)throw Error('فاکتور ثبت‌شده با مبلغ درخواستی هم‌خوانی ندارد؛ لطفاً فاکتور را بررسی کنید');
    return{number:s.number,id:s.id,total:s.total,due:s.due||0,customer:D.customerName(s.customerId)}},
  render(d){return `فاکتور ${d.number} ثبت شد.\nمشتری: ${d.customer}\nمبلغ: ${h.money(d.total)}${d.due?'\nمانده نسیه: '+h.shortMoney(d.due):''}`}});


/* ---------- purchase (same UI core: savePurchaseV18 reads #purSup + purchaseCart + payment inputs) ---------- */
WRITE({name:'create_purchase',desc:'ثبت سند خرید از تأمین‌کننده با اقلام و نحوه پرداخت (از همان مسیر خرید برنامه؛ موجودی و بهای تمام‌شده خودکار به‌روز می‌شود)',perm:'purchase.create',risk:'medium',
  params:P({supplier:{type:'string'},items:{type:'array',items:P({product:{type:'string'},color:{type:'string'},size:{type:'string'},qty:{type:'integer'},price:{type:'number',description:'قیمت خرید واحد؛ اگر نیامد قیمت خرید ثبت‌شده'}},['product','qty'])},method:{type:'string',enum:['cash','card','bank','credit']},...unitProps},['items']),
  prepare(p){
    const q={...p,items:(p.items||[]).map(x=>({...x}))};if(!q.items.length)return askQ('کدام کالا و چند عدد خریداری شد؟ (مثلاً «۱۰ تا نایک مشکی ۴۲»)','items','items');
    let sup=null;if(q.supplier||q.supplierId){const r=h.person('supplier',q);if(r.ask)return{status:'ask',ask:r.ask};if(r.error)return{status:'error',error:r.error};sup=r.item;q.supplierId=sup.id}
    const lines=[];
    for(let i=0;i<q.items.length;i++){const it=q.items[i];let v=it.variantId?window.variantBy(it.variantId):null;
      if(!v){const vs=h.variants(it);if(!vs.length)return err('NOT_FOUND',`کالای «${[it.product,it.color,it.size&&'سایز '+it.size].filter(Boolean).join(' ')}» پیدا نشد`);
        if(vs.length>1)return{status:'ask',ask:{question:`برای «${it.product||'کالا'}» چند مورد پیدا شد؛ کدام؟`,field:`items.${i}.variantId`,options:vs.slice(0,6).map(x=>({label:window.variantName(x),value:x.id}))}};v=vs[0];it.variantId=v.id}
      const qty=it.qty===undefined||it.qty===null?null:Number(it.qty);if(qty===null||!Number.isFinite(qty))return{status:'ask',ask:{question:`از «${window.variantName(v)}» چند عدد خریداری شد؟`,field:`items.${i}.qty`,type:'number'}};
      if(!Number.isInteger(qty)||qty<=0)return err('INVALID','تعداد باید عدد صحیح و مثبت باشد');
      const price=it.price!==undefined&&it.price!==null&&it.price!==''?h.toRial(it.price,q.unit):num(v.buyPrice);
      if(!(price>0))return{status:'ask',ask:{question:`قیمت خرید واحد «${window.variantName(v)}» چقدر است؟`,field:`items.${i}.price`,type:'amount'}};
      lines.push({id:v.id,qty,price,name:window.variantName(v)})}
    const total=lines.reduce((a,l)=>a+l.qty*l.price,0);
    if(!q.method||!METHODS[q.method])return{status:'ask',ask:{question:`جمع خرید ${h.money(total)} است. نحوه پرداخت؟`,field:'method',options:Object.entries(METHODS).map(([k,l])=>({label:l,value:k}))}};
    if(q.method==='credit'&&!sup)return{status:'ask',ask:{question:'برای خرید نسیه، نام تأمین‌کننده لازم است. نام تأمین‌کننده؟',field:'supplier',type:'text'}};
    if(q.method==='cash'&&typeof window.activeCashSession==='function'&&!window.activeCashSession())return err('FAILED','برای پرداخت نقدی ابتدا باید صندوق باز باشد.');
    return{status:'ready',params:{supplierId:q.supplierId||'',cart:lines.map(l=>({id:l.id,qty:l.qty,price:l.price})),method:q.method,total},needsConfirm:true,risk:total>=HIGH_AMOUNT_RIAL?'high':'medium',
      summary:`سند خرید${sup?' از «'+sup.name+'»':' (تأمین‌کننده متفرقه)'}:\n`+lines.map(l=>`• ${l.name} × ${U.fa(l.qty)} @ ${h.shortMoney(l.price)}`).join('\n')+`\nجمع: ${h.money(total)}\nپرداخت: ${METHODS[q.method]}`}},
  async run(p){
    const before=window.db.purchases.length;window.page='purchase';window.render();await h.waitFor('#purSup');await new Promise(r=>setTimeout(r,30));
    purchaseCart.splice(0,purchaseCart.length,...p.cart.map(x=>({...x})));
    document.querySelector('#purSup').value=p.supplierId||'';if(document.querySelector('#purSup').value!==(p.supplierId||''))throw Error('تأمین‌کننده در فرم خرید پیدا نشد');
    const f={cash:'#purCash',card:'#purCard',bank:'#purBank',credit:'#purCredit'};for(const[k,sel]of Object.entries(f)){const e=document.querySelector(sel);if(e)e.value=k===p.method?String(p.total):'0'}
    const cap=await h.captureToast(()=>window.savePurchaseV18());
    if(window.db.purchases.length!==before+1)throw Error(lastErr(cap)||'ثبت خرید انجام نشد');
    const s=window.db.purchases.at(-1);if(s.status!=='confirmed'||Math.abs(num(s.total)-p.total)>1)throw Error('سند خرید ثبت‌شده با مبلغ درخواستی هم‌خوانی ندارد؛ لطفاً بررسی کنید');
    return{number:s.number,total:s.total,due:s.due||0,supplier:(window.db.suppliers.find(x=>x.id===s.supplierId)||{}).name||'متفرقه'}},
  render(d){return `سند خرید ${d.number} ثبت شد.\nتأمین‌کننده: ${d.supplier}\nمبلغ: ${h.money(d.total)}${d.due?'\nمانده بدهی: '+h.shortMoney(d.due):''}\nموجودی و بهای تمام‌شدهٔ کالاها به‌روز شد.`}});

WRITE({name:'void_sale',desc:'ابطال فاکتور فروش (حذف حسابداری‌شده: سند معکوس ثبت و موجودی/حساب‌ها اصلاح می‌شود؛ فاکتور فیزیکی پاک نمی‌شود)',perm:'sales.void',risk:'high',
  params:P({number:{type:'string'},reason:{type:'string'}},['number']),
  prepare(p){const s=p.saleId?window.db.sales.find(x=>x.id===p.saleId):D.invoiceByNumber(p.number);if(!s)return err('NOT_FOUND',`فاکتور «${p.number||''}» پیدا نشد`);
    if(s.status==='voided')return err('FAILED',`فاکتور ${s.number} قبلاً باطل شده است`);
    if((window.db.returns||[]).some(r=>r.type==='sale'&&r.ref===s.number))return err('FAILED',`برای فاکتور ${s.number} برگشت از فروش ثبت شده؛ ابطال ممکن نیست`);
    const reason=h.clean(p.reason)||'ابطال به درخواست کاربر از طریق دستیار هوشمند';
    return{status:'ready',params:{saleId:s.id,reason},needsConfirm:true,risk:'high',summary:`فاکتور ${s.number} به مبلغ ${h.money(s.total)} (${D.customerName(s.customerId)}) باطل شود؟\nفاکتور حذف فیزیکی نمی‌شود؛ سند معکوس ثبت و موجودی و حساب‌ها اصلاح می‌شوند. دلیل: ${reason}`}},
  run(p){const s=window.db.sales.find(x=>x.id===p.saleId);window.Fin.voidSale(s.number,p.reason);const after=window.db.sales.find(x=>x.id===p.saleId);if(!after||after.status!=='voided')throw Error('ابطال انجام نشد');return{number:s.number,total:s.total}},
  render(d){return `فاکتور ${d.number} (${h.shortMoney(d.total)}) باطل شد؛ سند معکوس و بازگشت موجودی ثبت گردید.`}});

/* ---------- receipts / payments / settlement ---------- */
function partyPay(kind,full){return{
  prepare(p){
    const r=h.person(kind,p);if(r.ask)return{status:'ask',ask:r.ask};if(r.error)return{status:'error',error:r.error};
    const id=r.item.id,bal=kind==='customer'?window.customerBalance(id):window.supplierBalance(id);
    if(full&&!(bal>0))return err('FAILED',`${r.item.name} ${kind==='customer'?'بدهی':'مانده‌ای'} ندارد؛ چیزی برای تسویه نیست`);
    let amount;if(full)amount=bal;else{if(p.amount===undefined||p.amount===null||p.amount==='')return{status:'ask',ask:{question:`چه مبلغی ${kind==='customer'?'از «'+r.item.name+'» دریافت':'به «'+r.item.name+'» پرداخت'} شود؟`,field:'amount',type:'amount'}};amount=h.toRial(p.amount,p.unit)}
    if(!(amount>0))return err('INVALID','مبلغ معتبر نیست');
    if(amount>bal+0.01)return err('FAILED',`مبلغ بیشتر از مانده حساب است (مانده ${r.item.name}: ${h.money(bal)})`);
    const account=window.paymentAccount(p.account||'cash');
    if(account==='cash'&&typeof window.activeCashSession==='function'&&!window.activeCashSession())return err('FAILED','برای تراکنش نقدی ابتدا باید صندوق باز باشد. صندوق را باز کنید یا بانک/کارت را مشخص کنید.');
    const warn=kind==='supplier'&&window.accountBalance(account)+0.5<amount?`\n⚠ مانده ${accName(account)} (${h.shortMoney(window.accountBalance(account))}) کمتر از این مبلغ است.`:'';
    return{status:'ready',params:{[kind+'Id']:id,amount,account,full:!!full},needsConfirm:true,risk:full||amount>=HIGH_AMOUNT_RIAL?'high':'medium',
      summary:`${full?'تسویه کامل: ':''}${kind==='customer'?'دریافت':'پرداخت'} ${h.money(amount)} ${kind==='customer'?'از مشتری':'به تأمین‌کننده'} «${r.item.name}» ${kind==='customer'?'در':'از'} ${accName(account)}\nمانده فعلی ${h.shortMoney(bal)} ← پس از ثبت ${h.shortMoney(bal-amount)}${warn}`}},
  run(p){const id=p[kind+'Id'],list=kind==='customer'?window.db.customers:window.db.suppliers,party=list.find(x=>x.id===id);if(!party)throw Error('طرف حساب پیدا نشد');
    const bal0=kind==='customer'?window.customerBalance(id):window.supplierBalance(id);
    const row=window.atomic('تراکنش مالی (دستیار)',()=>window.addPayment({direction:kind==='customer'?'in':'out',partyType:kind,partyId:id,amount:p.amount,account:p.account,ref:'',note:(kind==='customer'?'دریافت از مشتری':'پرداخت به تأمین‌کننده')+' (دستیار هوشمند)'}));
    const bal1=kind==='customer'?window.customerBalance(id):window.supplierBalance(id);
    if(Math.abs((bal0-p.amount)-bal1)>1)throw Error('مانده حساب پس از ثبت با انتظار هم‌خوانی ندارد؛ لطفاً حساب را بررسی کنید');
    return{name:party.name,amount:p.amount,account:p.account,balance:bal1,paymentId:row&&row.id}},
  render(d){return `${kind==='customer'?'دریافت':'پرداخت'} ${h.money(d.amount)} ثبت شد (${accName(d.account)}).\nمانده جدید ${d.name}: ${d.balance>0?h.shortMoney(d.balance):'صفر'}`}
}}
const amtP={amount:{type:'number'},...unitProps,...acctProp};
WRITE(Object.assign({name:'record_receipt',desc:'دریافت وجه از مشتری (کاهش بدهی مشتری)',perm:'finance.receive',params:P({customer:{type:'string'},...amtP},['customer','amount'])},partyPay('customer',false)));
WRITE(Object.assign({name:'record_payment',desc:'پرداخت وجه به تأمین‌کننده (کاهش بدهی ما)',perm:'finance.pay',params:P({supplier:{type:'string'},...amtP},['supplier','amount'])},partyPay('supplier',false)));
WRITE(Object.assign({name:'settle_customer_debt',desc:'تسویه کامل بدهی یک مشتری',perm:'finance.receive',params:P({customer:{type:'string'},...acctProp},['customer'])},partyPay('customer',true)));
WRITE(Object.assign({name:'settle_supplier_debt',desc:'تسویه کامل بدهی ما به یک تأمین‌کننده',perm:'finance.pay',params:P({supplier:{type:'string'},...acctProp},['supplier'])},partyPay('supplier',true)));

/* ---------- cash session (shared business logic: window.openCashSession / closeCashSession) ---------- */
const hasAmt=v=>v!==undefined&&v!==null&&v!=='';
WRITE({name:'open_cash_session',desc:'باز کردن صندوق (شروع شیفت) با موجودی اولیه',perm:'cash.manage',params:P({amount:{type:'number'},...unitProps,note:{type:'string'}},['amount']),
  prepare(p){const s=window.activeCashSession();if(s)return err('INVALID',`صندوق ${s.number} از قبل باز است.`);
    if(!hasAmt(p.amount))return askQ('موجودی اولیه صندوق چقدر باشد؟ (مثلاً «۵ میلیون تومن» یا «صفر»)','amount','amount');
    const r=h.toRial(p.amount,p.unit);if(!Number.isFinite(r)||r<0)return err('INVALID','مبلغ موجودی اولیه معتبر نیست');
    return{status:'ready',params:{...p,rial:r,note:h.clean(p.note)},needsConfirm:true,summary:`باز کردن صندوق با موجودی اولیه ${h.money(r)}`}},
  run(p){const row=window.openCashSession(p.rial,p.note,'ai');return{number:row.number,openingCash:row.openingCash}},
  render(d){return `صندوق ${d.number} باز شد.\nموجودی اولیه: ${h.money(d.openingCash)}`}});
WRITE({name:'close_cash_session',desc:'بستن صندوق (پایان شیفت)؛ اگر مبلغ شمارش‌شده گفته نشود برابر موجودی مورد انتظار است',perm:'cash.manage',risk:'high',params:P({amount:{type:'number'},...unitProps,note:{type:'string'}},[]),
  prepare(p){const s=window.activeCashSession();if(!s)return err('INVALID','صندوق بازی وجود ندارد.');
    const exp=window.cashSessionExpected(s);let act=exp;if(hasAmt(p.amount))act=h.toRial(p.amount,p.unit);
    if(!Number.isFinite(act)||act<0)return err('INVALID','موجودی شمارش‌شده معتبر نیست');
    const diff=Math.round((act-exp)*100)/100,note=h.clean(p.note),has=Math.abs(diff)>=0.005;
    if(has&&!note)return askQ(`موجودی مورد انتظار ${h.money(exp)} است و با مبلغ شما ${h.money(Math.abs(diff))} ${diff>0?'اضافه':'کسری'} دارد. علت اختلاف چیست؟ (مثلاً «بابت خرد»)`,'note','text');
    return{status:'ready',params:{...p,actual:act,note},needsConfirm:true,risk:'high',summary:`بستن صندوق ${s.number}\nمورد انتظار: ${h.money(exp)}\nشمارش‌شده: ${h.money(act)}\n${has?'اختلاف: '+h.money(diff):'بدون اختلاف'}`}},
  run(p){return window.closeCashSession(p.actual,p.note,'ai')},
  render(d){return `صندوق ${d.number} بسته شد.\nمورد انتظار: ${h.money(d.expected)} · شمارش‌شده: ${h.money(d.actual)}${Math.abs(d.diff)>=0.005?' · اختلاف: '+h.money(d.diff):' · بدون اختلاف'}`}});

/* ---------- sale / purchase return tied to an invoice (existing service window.Fin.saleReturn / window.Fin.purchaseReturn) ---------- */
const retDoc=(type,raw)=>{const list=(type==='sale'?window.db.sales:window.db.purchases)||[];const r=String(raw||'');const ex=list.find(x=>String(x.number).toLowerCase()===r.toLowerCase());if(ex)return ex;const d=r.replace(/\D/g,'');if(!d)return null;const m=list.filter(x=>+String(x.number).replace(/\D/g,'').slice(-6)===+d);return m.length===1?m[0]:(m.length>1?m.sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]:null)};
const retMax=i=>Math.max(0,num(i.qty)-num(i.already));
WRITE({name:'create_return',desc:'ثبت برگشت از فروش یا برگشت از خرید متصل به فاکتور (کامل یا چند عدد از یک کالا)',perm:'returns.create',risk:'high',
  params:P({type:{type:'string',enum:['sale','purchase']},number:{type:'string',description:'شمارهٔ فاکتور'},product:{type:'string'},color:{type:'string'},size:{type:'string'},qty:{type:'number'},all:{type:'boolean',description:'برگشت همهٔ اقلام باقی‌مانده'},method:{type:'string',enum:['credit','cash','card','bank']},customerId:{type:'string'},supplierId:{type:'string'},note:{type:'string'}},['type']),
  prepare(p){const type=p.type==='purchase'?'purchase':'sale',list=(type==='sale'?window.db.sales:window.db.purchases)||[];
    const vids=(p.product||p.color||p.size)?new Set(D.findVariants({query:p.product||'',color:p.color,size:p.size}).map(v=>v.id)):null;
    let doc=null;
    if(p.number){doc=retDoc(type,p.number);if(!doc)return err('NOT_FOUND',`فاکتور ${type==='sale'?'فروش':'خرید'} «${p.number}» پیدا نشد`)}
    else{const pid=type==='sale'?p.customerId:p.supplierId;
      if(!pid)return askQ(`شمارهٔ فاکتور ${type==='sale'?'فروش':'خرید'} چیست؟ (مثلاً ${type==='sale'?'U-2026-S-000001':'U-2026-P-000001'} یا فقط «۱»)`,'number','text');
      const c=list.filter(x=>x.status==='confirmed'&&(type==='sale'?x.customerId:x.supplierId)===pid).sort((a,b)=>String(b.date).localeCompare(String(a.date))).filter(x=>window.returnItemsFor(x.number,type).some(i=>retMax(i)>0&&(!vids||vids.has(i.variantId))));
      if(!c.length)return err('NOT_FOUND','فاکتوری با کالای قابل برگشت برای این طرف حساب پیدا نشد.');
      if(c.length>1)return err('MISSING','چند فاکتور مناسب است: '+c.slice(0,5).map(x=>x.number).join('، ')+'. شمارهٔ فاکتور را بگویید.');
      doc=c[0]}
    if(doc.status==='voided')return err('FAILED',`فاکتور ${doc.number} باطل شده و برگشت ندارد.`);
    const items=window.returnItemsFor(doc.number,type);let qtys=items.map(()=>0),lines=[];
    if(p.all){items.forEach((i,n)=>{qtys[n]=retMax(i)});if(!qtys.some(q=>q>0))return err('FAILED',`همهٔ اقلام فاکتور ${doc.number} قبلاً برگشت خورده است.`)}
    else{if(!vids)return askQ('کدام کالا از فاکتور '+doc.number+' برگردد؟ (مثلاً «نایک مشکی ۴۲») یا بگویید «همه».','product','text');
      const sel=items.map((i,n)=>({i,n})).filter(x=>vids.has(x.i.variantId));
      if(!sel.length)return err('NOT_FOUND',`این کالا در فاکتور ${doc.number} نیست.`);
      if(sel.length>1)return err('MISSING','چند قلم مطابق است: '+sel.map(x=>h.vname(window.variantBy(x.i.variantId))).join('، ')+'. دقیق‌تر بگویید (رنگ/سایز).');
      const q=num(p.qty);if(!(q>0))return askQ('چند عدد برگردد؟','qty','number');if(!Number.isInteger(q))return err('INVALID','تعداد برگشت باید عدد صحیح باشد.');
      const mx=retMax(sel[0].i);if(q>mx)return err('FAILED',`حداکثر ${U.fa(mx)} عدد از این قلم قابل برگشت است (فاکتور: ${U.fa(num(sel[0].i.qty))}، قبلاً برگشت‌شده: ${U.fa(num(sel[0].i.already))}).`);
      qtys[sel[0].n]=q}
    items.forEach((i,n)=>{if(qtys[n]>0)lines.push(`${U.fa(qtys[n])} عدد ${h.vname(window.variantBy(i.variantId))}`)});
    const hasParty=type==='sale'?!!doc.customerId:!!doc.supplierId;
    const method=['credit','cash','card','bank'].includes(p.method)?p.method:(hasParty?'credit':'cash');
    if(method==='credit'&&!hasParty)return err('FAILED','این فاکتور طرف حساب ندارد؛ روش تسویه را نقدی/کارتخوان/بانک بگویید.');
    if(method==='cash'&&!window.activeCashSession())return err('FAILED','برای برگشت نقدی ابتدا باید صندوق باز باشد.');
    const est=items.reduce((a,i,n)=>a+(qtys[n]>0?qtys[n]*num(i.unitPrice):0),0);
    const how={credit:'ثبت در حساب طرف حساب',cash:'نقدی از صندوق',card:'کارتخوان',bank:'بانک'}[method];
    const byId={};items.forEach((i,n)=>{if(qtys[n]>0)byId[i.id]=qtys[n]});
    return{status:'ready',params:{type,number:doc.number,qtys:byId,method,note:h.clean(p.note)},needsConfirm:true,risk:'high',summary:`برگشت ${type==='sale'?'فروش':'خرید'} از فاکتور ${doc.number}\n${lines.join('\n')}\nمبلغ برآوردی: ${h.money(est)} (مبلغ دقیق با تخفیف فاکتور و مالیات هنگام ثبت محاسبه می‌شود)\nتسویه: ${how}\nموجودی و حساب‌ها اصلاح می‌شوند.`}},
  run(p){const a={ref:p.number,qtys:p.qtys,method:p.method,note:p.note||'ثبت از طریق دستیار'};const row=p.type==='sale'?window.Fin.saleReturn(a):window.Fin.purchaseReturn(a);return{type:p.type,ref:p.number,total:row.refund!==undefined?row.refund:row.total}},

/* ---------- product price / stock / product ---------- */
function pickVariants(p,field,opts){ /* -> {vs}|{ask}|{error} */
  if(p.variantIds&&p.variantIds.length)return{vs:p.variantIds.map(window.variantBy).filter(Boolean)};
  const vs=h.variants(p);
  if(!vs.length)return{error:{code:'NOT_FOUND',message:`کالای «${[p.product,p.color,p.size&&'سایز '+p.size].filter(Boolean).join(' ')}» پیدا نشد`}};
  if(vs.length===1||p.applyAll)return{vs};
  if(opts.single)return{ask:{question:'چند مورد پیدا شد؛ کدام؟',field:'variantIds',wrap:true,options:vs.slice(0,6).map(x=>({label:`${window.variantName(x)} · موجودی ${U.fa(x.stock)}`,value:x.id}))}};
  return{ask:{question:`${U.fa(vs.length)} تنوع با این مشخصات هست؛ تغییر روی کدام اعمال شود؟`,field:'variantIds',wrap:true,options:[...vs.slice(0,5).map(x=>({label:window.variantName(x),value:x.id})),{label:`همهٔ ${U.fa(vs.length)} مورد`,value:'__all__',all:vs.map(x=>x.id)}]}};
}

    if(p.sellPrice===undefined||p.sellPrice===null||p.sellPrice==='')return askQ('قیمت فروش جدید چقدر باشد؟','sellPrice','amount');const price=h.toRial(p.sellPrice,p.unit);if(!(price>0))return err('INVALID','قیمت جدید باید بیشتر از صفر باشد');

    if(vs.some(v=>num(v.sellPrice)!==p.price))throw Error('تغییر قیمت اعمال نشد');return{count:vs.length,price:p.price,names:vs.slice(0,3).map(v=>window.variantName(v))}},

WRITE({name:'adjust_stock',desc:'تعدیل موجودی یک کالا (افزایش/کاهش یا تعیین موجودی دقیق) با ثبت دلیل',perm:'inventory.adjust',risk:'high',
  params:P({product:{type:'string'},color:{type:'string'},size:{type:'string'},delta:{type:'integer',description:'تغییر مثبت یا منفی'},setTo:{type:'integer',description:'موجودی نهایی'},reason:{type:'string'}},['product']),
  prepare(p){const r=pickVariants(p,'variantIds',{single:true});if(r.ask)return{status:'ask',ask:r.ask};if(r.error)return{status:'error',error:r.error};if(r.vs.length!==1)return err('INVALID','تعدیل موجودی باید روی یک کالای مشخص انجام شود');const v=r.vs[0];

    if(!Number.isFinite(delta)||delta===0)return p.delta===undefined&&p.setTo===undefined?{status:'ask',ask:{question:`موجودی «${window.variantName(v)}» چقدر تغییر کند؟ (مثلاً ۵ یا منفی ۲)`,field:'delta',type:'number'}}:err('INVALID','مقدار تغییر صفر است');
    if(!Number.isInteger(delta))return err('INVALID','تعداد باید عدد صحیح باشد');if(num(v.stock)+delta<0)return err('FAILED',`موجودی «${window.variantName(v)}» (${U.fa(num(v.stock))}) برای کاهش ${U.fa(Math.abs(delta))} کافی نیست`);
    const reason=h.clean(p.reason)||'اصلاح موجودی توسط دستیار هوشمند';

  run(p){const v=window.variantBy(p.variantId),b=num(v.stock);window.atomic('تعدیل موجودی (دستیار)',()=>{window.stockMove(v.id,p.delta,'adjustment','manual');window.audit('تعدیل موجودی',v.id,p.reason+' (دستیار)')});if(num(window.variantBy(p.variantId).stock)!==b+p.delta)throw Error('موجودی پس از ثبت با انتظار هم‌خوانی ندارد');return{name:window.variantName(v),from:b,to:b+p.delta}},
  render(d){return `موجودی «${d.name}» از ${U.fa(d.from)} به ${U.fa(d.to)} تغییر کرد.`}});

function scoreIntents(f){
  const out=[];
  for(const it of INTENTS){
    if(!it.need.every(g=>g.some(k=>f[k])))continue;
    let s=0;for(const[k,w]of Object.entries(it.w))if(f[k])s+=w;for(const[k,w]of Object.entries(it.av||{}))if(f[k])s+=w;
    if(s>0)out.push({id:it.id,score:s});
  }
  return out.sort((a,b)=>b.score-a.score);
}

/* answer to a clarification question */
function parseAnswer(ask,text){
  const n=norm2(text),toks=T(n);
  if(ask.options&&ask.options.length){
    const nums=U.extractNumbers(toks);if(nums.length&&Number.isInteger(nums[0].value)&&nums[0].value>=1&&nums[0].value<=ask.options.length&&toks.length<=3)return ask.options[nums[0].value-1];
    if(/^(همه|همشون|همه شون|هر ?دو|همگی)$/.test(n)){const all=ask.options.find(o=>o.all);if(all)return all}
    let best=null,bs=0;for(const o of ask.options){const sc=(function(){const q=toks.map(U.stem).filter(x=>x.length>1),c=T(N(o.label)).map(U.stem);if(!q.length)return 0;let s=0;for(const x of q){if(c.some(y=>y===x||(x.length>=3&&(y.startsWith(x)||x.startsWith(y)))||U.fuzzyEq(x,y)))s++}return s/q.length})();if(sc>bs){bs=sc;best=o}}
    if(best&&bs>=.99){const ties=ask.options.filter(o=>o!==best&&(function(){const q=toks.map(U.stem).filter(x=>x.length>1),c=T(N(o.label)).map(U.stem);return q.length&&q.every(x=>c.some(y=>y===x||(x.length>=3&&(y.startsWith(x)||x.startsWith(y)))))})());if(!ties.length)return best}
    return null}
  if(ask.type==='number'){const nums=U.extractNumbers(toks);if(!nums.length)return null;let v=nums[0].value;if(/منفی|کم|کسر|−|-/.test(n))v=-Math.abs(v);return{value:v}}
  if(ask.type==='amount'){const nums=U.extractNumbers(toks);if(!nums.length)return null;return{value:nums[0].value,unit:/ریال/.test(n)?'rial':/تومان|تومن/.test(n)?'toman':undefined}}
  if(ask.type==='text'){const t=h.clean(text);return t.length>=2?{value:t}:null}
  if(ask.type==='items'){const it=NLU.itemsFromText?NLU.itemsFromText(text,ctx):null;return it&&it.length?{value:it}:null}
  return null;
}
async function answerClarify(text,src){
  const c=ctx.clarify;if(!c)return null;
  if(isNo(text)){ctx.clarify=null;return[msg('باشه، انصراف داده شد.')]}
  const a=parseAnswer(c.ask,text);
  if(!a){const peek=NLU.understand(text,ctx);if(peek.best&&peek.best.score>=4.5&&!peek.followUp){ctx.clarify=null;return null}
    c.tries=(c.tries||0)+1;if(c.tries>=2){ctx.clarify=null;return[msg('پاسخ را متوجه نشدم و درخواست قبلی لغو شد.','error')]}return[msg('متوجه نشدم. '+c.ask.question,'ask',{options:(c.ask.options||[]).map((o,k)=>({label:`${U.fa(k+1)}. ${o.label}`,value:String(k+1)}))})]}

  for(const k of Object.keys(c.params)){if(/Obj$/.test(k))params[k]=c.params[k]}

  else if(f==='amount'){params.amount=a.value;if(a.unit)params.unit=a.unit}
  else if(a.value!==undefined&&c.ask.type!=='number'&&c.ask.type!=='text'&&c.ask.type!=='amount'||a.value!==undefined){h.setPath(params,f,a.value);if(c.ask.type==='amount'&&a.unit)params.unit=a.unit}

}

const SYSTEM_BASE='تو مغز دستیار عملیاتی نرم‌افزار حسابداری و فروشگاهی «یونیک» هستی و فقط فارسی پاسخ می‌دهی. کاربر به فارسی محاوره‌ای، عامیانه، کوتاه، با غلط املایی، یا از طریق تشخیص گفتار (که ممکن است کلمات را اشتباه بنویسد) حرف می‌زند. وظیفهٔ تو فهمیدن منظور واقعی اوست، نه تطبیق کلمه‌به‌کلمه؛ مثلاً «چقد فروختیم»=گزارش فروش، «کی بهم بدهکاره»=بدهکاران، «تومن»=تومان، «موجودی ندارم»=کم‌موجودی. هر درخواستی را به ابزار مناسب نگاشت کن و اگر چند کار خواست، چند ابزار را پشت‌سرهم صدا بزن. قوانین: ۱) هر عدد و اطلاعات مالی را فقط از خروجی ابزارها بگو؛ هرگز مبلغ، موجودی، مشتری یا فاکتور نساز. ۲) برای ثبت/ویرایش/ابطال فقط ابزار مناسب را صدا بزن؛ تأیید نهایی را خود سیستم از کاربر می‌گیرد و تو نباید بگویی عملیات انجام شد. ۳) نام مشتری، کالا و تأمین‌کننده را همان‌طور که شنیده یا خوانده‌ای به ابزار بده (ابزارها خودشان شبیه‌یابی می‌کنند)؛ اگر مبهم بود ابزار را صدا بزن تا خود سیستم بپرسد. ۴) عبارت‌های ارجاعی مثل «همون»، «دیروز چی؟»، «مقایسه‌شون کن»، «فقط مشکی‌ها» را با تاریخچهٔ گفتگو حل کن. ۵) مبلغ‌ها را همان‌طور که کاربر گفته با unit (تومان/ریال) بده؛ اگر واحد نگفته unit را نگذار. ۶) اگر پیام سلام یا پرسش دربارهٔ قابلیت‌هاست کوتاه و دوستانه پاسخ بده؛ اگر بی‌ربط به کار فروشگاه است مؤدبانه بگو فقط در کارهای یونیک کمک می‌کنی. ۷) فقط وقتی سؤال بپرس که بدون آن اجرای درست ممکن نیست؛ سؤال کوتاه و تک‌موردی باشد. ۸) اگر کاربر گفت کالا اضافه/ثبت/تعریف کن، بلافاصله create_product را با هر اطلاعاتی که دارد صدا بزن: نام کالا بدون رنگ و سایز، برند، رنگ‌ها و سایزها به‌صورت آرایهٔ جدا، و قیمت‌هایی که گفته؛ قیمتی که نگفته را خودت نساز. اگر مبلغ ناقص یا مبهم بود (مثلاً ارقام ناقص) حدس نزن و کوتاه بپرس. ۹) اگر درخواست چند کار دارد (مثلاً ثبت کالا و بعد ثبت خرید)، کارها را به ترتیب انجام بده. ۱۰) پاسخ کوتاه و دقیق بده.';
function sysPrompt(){
  const L=ctx.last||{},p=[];
  try{p.push('تاریخ امروز (شمسی): '+U.fmtJalali(new Date())+'، ساعت '+new Date().toTimeString().slice(0,5))}catch(_){}
  try{p.push('نقش کاربر: '+Perm.user().role)}catch(_){}
  p.push('واحد پیش‌فرض مبالغ گفتاری: '+((window.db.settings.ai||{}).spokenUnit==='rial'?'ریال':'تومان'));
  if(L.tool)p.push('آخرین ابزار اجراشده: '+L.tool);
  if(L.periods&&L.periods.length)p.push('بازه‌های اخیر گفتگو: '+L.periods.map(x=>x.label).join('، '));
  if(L.invoiceNumber)p.push('آخرین فاکتور مطرح‌شده: '+L.invoiceNumber);

}
function numbersIn(s){return(U.digits(String(s)).replace(/(\d)[,٬](?=\d{3})/g,'$1').match(/\d+(?:\.\d+)?/g)||[]).map(Number)}
/* hallucination guard: every number in the model text must exist in tool evidence (as is, or toman<->rial) */

  const msgs=[{role:'system',content:sysPrompt()},...ctx.history.slice(-10).map(x=>({role:x.role,content:x.text.slice(0,500)})),{role:'user',content:text+hint}];

function slim(d){const s=JSON.stringify(d);if(s.length<6000)return d;const o=Array.isArray(d)?d.slice(0,20):{...d};for(const k of Object.keys(o))if(Array.isArray(o[k])&&o[k].length>20)o[k]=o[k].slice(0,20);return o}

const Chat=U.chat={

    {const th=U.Teach&&await U.Teach.handle(text,src);if(th)return th;
     if(U.Teach)text=U.Teach.rewrite(text)}

    {const qp=U.QuickPeople&&await U.QuickPeople.handle(text,src);if(qp)return qp}

    info.entities={period:info.e.periods.map(p=>p.label),customer:info.e.customerMatches.length?'matched':'',product:info.e.productQuery||'',color:info.e.color||'',size:info.e.size||'',amounts:info.e.amounts.length};

  if(q==='__audit')return UI.auditModal();
  if(q==='__diag')return UI.diagModal();
  if(q==='__chat'){window.page='ai';return window.render()}
  if(q==='__newProduct')return window.aiProductCreateModal();
  if(q==='__file'){const f=document.querySelector('#dockFile');return f&&f.click()}
  if(fill||q===''){input.value=q===''?PRODUCT_TEMPLATE:q;UI.dockDraft=input.value;input.focus();try{input.setSelectionRange(input.value.length,input.value.length)}catch(_){}if(q==='')input.select();return}
  UI.submit(q,'text');
}

/* ---- inline answer area (last exchange; stays visible while a confirmation/choice is pending) ---- */
UI.renderDock=function(){
  const out=document.getElementById('dockOut');if(!out)return;
  out.innerHTML='';out.classList.remove('show');
  const t=UI.transcript;let k=-1;for(let i=t.length-1;i>=0;i--)if(t[i].role==='user'){k=i;break}
  if(k<0)return;
  const slice=t.slice(k),last=slice[slice.length-1];
  const needs=!!(last&&(last.pending||(last.options&&last.options.length)));
  if(!needs&&(UI.dockHiddenAt===t.length||UI.askedPage!==window.page))return;
  const hd=document.createElement('div');hd.className='aidock-outhead';hd.innerHTML='<span>پاسخ دستیار</span>';
  const x=document.createElement('button');x.type='button';x.className='aidock-x';x.textContent='×';x.title='بستن پاسخ';x.onclick=()=>{UI.dockHiddenAt=t.length;UI.renderDock()};hd.appendChild(x);out.appendChild(hd);
  slice.forEach((m,i)=>out.appendChild(UI.bubble(m,i===slice.length-1)));
  out.classList.add('show');
  if(UI._dockScrolled!==t.length){UI._dockScrolled=t.length;try{out.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(_){}}
};

/* ===== Unique AI engine v1 — 75 table pager =====
   Very long tables (thousands of rows) are shown in chunks; hidden rows stay in the DOM so "select all", exports and printing keep working. */
(function(){'use strict';
const U=window.UAI,LIMIT=200,STEP=200;
const fa=n=>U.fa?U.fa(n):String(n);
function paginate(){
  const host=document.querySelector('#content');if(!host)return;
  host.querySelectorAll('tbody').forEach(tb=>{
    if(tb.dataset.uniPaged)return;
    const rows=[...tb.children].filter(r=>r.tagName==='TR');
    if(rows.length<=LIMIT+50)return;
    tb.dataset.uniPaged='1';
    let shown=LIMIT;
    rows.forEach((r,i)=>{if(i>=shown)r.hidden=true});
    const head=tb.closest('table')&&tb.closest('table').querySelector('thead tr');
    const cols=Math.max(1,(head?head.children.length:0)||rows[0].children.length);
    const tr=document.createElement('tr');tr.className='uni-pager';
    const td=document.createElement('td');td.colSpan=cols;tr.appendChild(td);tb.appendChild(tr);
    const draw=()=>{
      td.textContent='';
      const info=document.createElement('span');info.textContent=`نمایش ${fa(Math.min(shown,rows.length))} از ${fa(rows.length)} ردیف`;td.appendChild(info);
      if(shown<rows.length){
        const more=document.createElement('button');more.type='button';more.className='btn';more.textContent=`${fa(STEP)} ردیف بعدی`;
        more.onclick=()=>{for(let i=shown;i<Math.min(shown+STEP,rows.length);i++)rows[i].hidden=false;shown+=STEP;draw()};
        const all=document.createElement('button');all.type='button';all.className='btn';all.textContent='نمایش همه';
        all.onclick=()=>{rows.forEach(r=>{r.hidden=false});shown=rows.length;draw()};
        td.append(more,all);
      }
    };
    draw();
  });
}
U.paginate=paginate;
const _render=window.render;
if(typeof _render==='function'&&!_render._uaiPager){
  const w=function(){const r=_render.apply(this,arguments);try{paginate()}catch(e){console.warn('pager',e)}return r};w._uaiPager=true;window.render=w;
}
/* pages that rewrite their own #content (search boxes etc.) */
let sched=false;const app=document.getElementById('app');
if(app&&typeof MutationObserver!=='undefined')new MutationObserver(()=>{if(sched)return;sched=true;setTimeout(()=>{sched=false;try{paginate()}catch(e){}},30)}).observe(app,{childList:true,subtree:true});
})();

/* ===== Unique — 80 backup: automatic restore points + file-backup reminder =====
   Two different protections (the UI says so honestly):
   1) restore points: compressed snapshots kept in this browser (IndexedDB) — protect against mistakes / bad imports / corrupted data;
   2) file backups: a file the user keeps OUTSIDE the device — the only protection against a wiped browser or a lost phone; we remind about it.
   The older "پشتیبان خودکار" switch in settings had no effect at all; it now drives restore points. */

const say=(text,kind)=>({text,kind:kind||'ai'});
