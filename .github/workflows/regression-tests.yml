name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright numpy opencv-python-headless
          python -m playwright install --with-deps chromium
      - name: Validate offline voice module
        run: node --check src/ui/offline-voice.js
      - name: Build the static offline distribution (Vosk + Persian model)
        run: python scripts/build_static.py
      - name: Start built app server
        run: |
          cd dist
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/unique-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/unique-http.log
          exit 1
      - name: Run browser regression suite against built distribution
        run: python tests/run_tests.py
