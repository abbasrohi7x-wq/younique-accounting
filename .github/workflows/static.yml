name: Build and publish Unique Pro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build offline-first static app and bundle Vosk
        run: python scripts/build_static.py
      - name: Verify offline OCR and voice assets
        run: |
          test -s dist/index.html
          test -s dist/vendor/tesseract/tesseract.min.js
          test -s dist/vendor/tesseract/worker.min.js
          test -s dist/vendor/tesseract/core/tesseract-core-simd-lstm.wasm.js
          test -s dist/vendor/tesseract/core/tesseract-core-lstm.wasm.js
          test -s dist/vendor/tesseract/lang/fas.traineddata.gz
          test -s dist/vendor/tesseract/lang/eng.traineddata.gz
          test -s dist/vendor/vosk/vosk.js
          test -s dist/vendor/vosk/model.tar.gz
          tar -tzf dist/vendor/vosk/model.tar.gz | grep -q 'model/am/final.mdl'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
