name: Validate Unique Pro offline-first app
on:
  push:
    branches:
      - chatgpt-push-test-2026-11-13
  workflow_dispatch:

concurrency:
  group: unique-pro-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check Python build script
        run: python -m py_compile scripts/build_static.py
      - name: Check browser JavaScript syntax
        run: |
          node --check src/ui/offline-voice.js
          node --check src/ui/upgrade.js
          node --check src/ui/local-nlu.js
      - name: Build static site and Vosk assets
        run: python scripts/build_static.py
      - name: Verify packaged offline OCR and voice runtimes
        run: |
          test -s dist/vendor/tesseract/tesseract.min.js
          test -s dist/vendor/tesseract/worker.min.js
          test -s dist/vendor/tesseract/core/tesseract-core-simd-lstm.wasm.js
          test -s dist/vendor/tesseract/core/tesseract-core-lstm.wasm.js
          test -s dist/vendor/tesseract/lang/fas.traineddata.gz
          test -s dist/vendor/tesseract/lang/eng.traineddata.gz
          test -s dist/vendor/vosk/vosk.js
          test -n "$(find dist/vendor/vosk -maxdepth 1 -type f -name '*worker*.js' -print -quit)"
          test -s dist/vendor/vosk/model.tar.gz
          tar -tzf dist/vendor/vosk/model.tar.gz | grep -q 'model/am/final.mdl'
          test -s dist/index.html
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright opencv-python-headless
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run full browser regression suite against built output
        run: |
          python -m http.server 8765 --directory dist >/tmp/unique-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          python tests/run_tests.py
